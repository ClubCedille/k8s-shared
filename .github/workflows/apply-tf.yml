name: Terraform Plan & Apply

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - 'data/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'data/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: authentik
            dir: terraform/authentik
          - name: outline
            dir: terraform/outline/authentik-vault
          - name: nodered
            dir: terraform/nodered/authentik-vault
          - name: coder
            dir: terraform/coder/authentik-vault
          - name: matomo
            dir: terraform/matomo/authentik-vault
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Setup Kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.etsmtl.club
          method: jwt
          path: jwt/github-actions
          role: k8s-shared-terraform
          jwtGithubAudience: https://vault.etsmtl.club
          exportToken: true

      - name: Tofu Plan
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
          TF_VAR_db_user: ${{ secrets.OUTLINE_DB_USER }}
          TF_VAR_db_password: ${{ secrets.OUTLINE_DB_PASSWORD }}
        run: |
          cd "${{ matrix.dir }}"
          tofu init
          tofu plan -no-color -out=plan.tfplan
          tofu show -no-color plan.tfplan > plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/plan.tfplan
            ${{ matrix.dir }}/plan.txt

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        uses: clubcedille/cedille-workflows/.github/actions/tofu-plan-comment@master
        with:
          plan-path: ${{ matrix.dir }}/plan.txt
          module: ${{ matrix.name }}
          artifact-name: tfplan-${{ matrix.name }}

  apply:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: authentik
            dir: terraform/authentik
          - name: outline
            dir: terraform/outline/authentik-vault
          - name: nodered
            dir: terraform/nodered/authentik-vault
          - name: coder
            dir: terraform/coder/authentik-vault
          - name: matomo
            dir: terraform/matomo/authentik-vault
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Setup Kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.etsmtl.club
          method: jwt
          path: jwt/github-actions
          role: k8s-shared-terraform
          jwtGithubAudience: https://vault.etsmtl.club
          exportToken: true

      - name: Tofu Apply
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
          TF_VAR_db_user: ${{ secrets.OUTLINE_DB_USER }}
          TF_VAR_db_password: ${{ secrets.OUTLINE_DB_PASSWORD }}
        run: |
          cd "${{ matrix.dir }}"
          tofu init
          tofu apply -auto-approve

      - name: Reconcile exec role permissions
        if: matrix.name == 'authentik'
        env:
          AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
        run: |
          "${{ github.workspace }}/scripts/reconcile-exec-perms.sh" --apply
