name: Terraform Plan & Apply

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module(s) to plan/apply
        required: true
        default: auth-only
        type: choice
        options:
          - auth-only
          - authentik
          - outline
          - nodered
          - coder
          - matomo
          - all
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            authentik:
              - '.github/workflows/apply-tf.yml'
              - 'terraform/authentik/**'
            outline:
              - 'terraform/outline/authentik-vault/**'
            nodered:
              - 'terraform/nodered/authentik-vault/**'
            coder:
              - 'terraform/coder/authentik-vault/**'
            matomo:
              - 'terraform/matomo/authentik-vault/**'

      - name: Compute target matrix
        id: matrix
        env:
          REQUEST: ${{ inputs.module }}
          AUTHENTIK: ${{ steps.filter.outputs.authentik }}
          OUTLINE: ${{ steps.filter.outputs.outline }}
          NODERED: ${{ steps.filter.outputs.nodered }}
          CODER: ${{ steps.filter.outputs.coder }}
          MATOMO: ${{ steps.filter.outputs.matomo }}
        run: |
          case "$REQUEST" in
            authentik)           AUTHENTIK=true ;;
            outline)             OUTLINE=true ;;
            nodered)             NODERED=true ;;
            coder)               CODER=true ;;
            matomo)              MATOMO=true ;;
            all)                 AUTHENTIK=true; OUTLINE=true; NODERED=true; CODER=true; MATOMO=true ;;
            auth-only|"")        ;;
            *)                   echo "unsupported module: $REQUEST" >&2; exit 1 ;;
          esac

          targets=()
          for m in authentik outline nodered coder matomo; do
            case "$m" in
              authentik) b=$AUTHENTIK ;; outline) b=$OUTLINE ;; nodered) b=$NODERED ;; coder) b=$CODER ;; matomo) b=$MATOMO ;;
            esac
            [ "$b" = true ] && targets+=("$m")
          done

          matrix='[]'
          for t in "${targets[@]}"; do
            [ "$t" = authentik ] && dir="terraform/authentik" || dir="terraform/$t/authentik-vault"
            matrix=$(jq -c --arg n "$t" --arg d "$dir" '. + [{name: $n, dir: $d}]' <<<"$matrix")
          done
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix || '{"include":[]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Setup Kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.etsmtl.club
          method: jwt
          path: jwt/github-actions
          role: k8s-shared-terraform
          jwtGithubAudience: https://vault.etsmtl.club
          exportToken: true

      - name: Tofu Plan
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
          TF_VAR_db_user: ${{ secrets.OUTLINE_DB_USER }}
          TF_VAR_db_password: ${{ secrets.OUTLINE_DB_PASSWORD }}
        run: |
          cd "${{ matrix.dir }}"
          tofu init
          tofu plan -no-color -out=plan.tfplan
          tofu show -no-color plan.tfplan > plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/plan.tfplan
            ${{ matrix.dir }}/plan.txt

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        uses: clubcedille/cedille-workflows/.github/actions/tofu-plan-comment@master
        with:
          plan-path: ${{ matrix.dir }}/plan.txt
          module: ${{ matrix.name }}

  apply:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix || '{"include":[]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Setup Kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.etsmtl.club
          method: jwt
          path: jwt/github-actions
          role: k8s-shared-terraform
          jwtGithubAudience: https://vault.etsmtl.club
          exportToken: true

      - name: Tofu Apply
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
          TF_VAR_db_user: ${{ secrets.OUTLINE_DB_USER }}
          TF_VAR_db_password: ${{ secrets.OUTLINE_DB_PASSWORD }}
        run: |
          cd "${{ matrix.dir }}"
          tofu init
          tofu apply -auto-approve
