name: OpenTofu Force Unlock

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Terraform module directory"
        required: true
        type: choice
        options:
          - terraform/authentik
          - terraform/outline/authentik-vault
          - terraform/nodered/authentik-vault
          - terraform/coder/authentik-vault
          - terraform/coroot/authentik-vault
          - terraform/matomo/authentik-vault
          - terraform/penpot/authentik-vault
          - terraform/inventree/authentik-vault
          - terraform/hi-events/authentik-vault
          - terraform/policy-reporter/authentik-vault
          - terraform/dependency-track/authentik-vault
      lock_id:
        description: "Lock ID from the 'Error acquiring the state lock' message"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-latest
    concurrency:
      group: tofu-force-unlock-${{ inputs.directory }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Setup Kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Force unlock state
        env:
          LOCK_ID: ${{ inputs.lock_id }}
        run: |
          set -euo pipefail
          cd "${{ inputs.directory }}"
          tofu init -input=false -no-color
          tofu force-unlock -force "$LOCK_ID"
