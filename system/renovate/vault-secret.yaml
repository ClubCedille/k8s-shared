apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: renovate-secret
spec:
  refreshPeriod: 1h0m0s
  refreshThreshold: 90
  syncOnResourceChange: false
  vaultSecretDefinitions:
    - authentication:
        path: kubernetes
        role: secret-reader
        serviceAccount:
          name: default
      name: renovate
      path: kv/data/renovate-operator/default/github-token
      requestType: GET
  output:
    name: renovate-secret
    stringData:
      GITHUB_COM_USER: '{{ .renovate.GITHUB_COM_USER }}'
      GITHUB_COM_TOKEN: '{{ .renovate.GITHUB_COM_TOKEN }}'
      RENOVATE_TOKEN: '{{ .renovate.RENOVATE_TOKEN }}'
