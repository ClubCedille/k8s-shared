---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate-operator
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared.git
    path: system/renovate
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
