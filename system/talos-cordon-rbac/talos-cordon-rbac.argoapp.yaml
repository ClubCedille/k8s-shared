apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-cordon-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: system/talos-cordon-rbac
    targetRevision: HEAD
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
