---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: ets-ctfd-httpproxy
spec:
  virtualhost:
    fqdn: ing101.etsmtl.club
    tls:
      secretName: ets-ctfd-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: ctfd
          port: 80
      enableWebsockets: true
