apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: penpot
spec:
  virtualhost:
    fqdn: penpot.prodv2.cedille.club
    tls:
      secretName: penpot-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: penpot
          port: 8080
