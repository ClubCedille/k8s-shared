# yaml-language-server: $schema=values.schema.json
# Overrides for the penpot chart (https://helm.penpot.app). Only the values we
# deviate from the chart defaults are listed here; see
# ../charts/penpot-1.11.3/values.yaml for the full reference.

config:
  publicUri: "https://penpot.prodv2.cedille.club"

  # OIDC login against Authentik; the provider/secret are managed by
  # terraform/penpot/authentik-vault and synced into penpot-oidc-secret.
  flags: "enable-registration enable-login-with-password disable-email-verification enable-smtp enable-login-with-oidc enable-oidc-registration"

  # Session signing key.
  existingSecret: "penpot-secret"
  secretKeys:
    apiSecretKey: "apiKey"

  # PostgreSQL (CloudNativePG "cnpg" cluster in this namespace).
  postgresql:
    existingSecret: "penpot-secret"
    secretKeys:
      postgresqlUriKey: "uri"
      usernameKey: "username"
      passwordKey: "password"

  # Valkey is deployed as a separate chart (see kustomization.yaml), which the
  # penpot chart no longer bundles.
  redis:
    host: "penpot-valkey"

  providers:
    oidc:
      enabled: true
      baseURI: "https://auth.etsmtl.club/application/o/penpot/"
      roles: ""
      scopes: "openid profile email"
    existingSecret: "penpot-oidc-secret"
    secretKeys:
      oidcClientIDKey: "OIDC_CLIENT_ID"
      oidcClientSecretKey: "OIDC_CLIENT_SECRET"

persistence:
  assets:
    accessModes:
      - ReadWriteMany
