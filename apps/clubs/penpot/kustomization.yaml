apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: penpot
  namespace: penpot
resources:
  - prod/certificate.yaml
  - prod/cnpg.yaml
  - prod/httpproxy.yaml
  - prod/vault.yaml
helmCharts:
  - name: valkey
    version: "0.9.3"
    repo: "https://valkey.io/valkey-helm/"
    releaseName: "penpot"
    namespace: penpot
    valuesFile: "helm/valkey-values.yaml"
  - name: penpot
    version: "1.11.3"
    repo: "https://helm.penpot.app/"
    releaseName: "penpot"
    namespace: penpot
    valuesFile: "helm/values.yaml"
