apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: planifets-chatbot-qdrant
  annotations:
    kube-score/ignore: pod-networkpolicy, pod-probes
spec:
  serviceName: planifets-chatbot-qdrant
  replicas: 3
  selector:
    matchLabels:
      app: planifets-chatbot-qdrant
  template:
    metadata:
      labels:
        app: planifets-chatbot-qdrant
    spec:
      securityContext:
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - planifets-chatbot-qdrant
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: qdrant
          image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
          imagePullPolicy: Always
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
            - containerPort: 6335
              name: p2p
          env:
            # https://qdrant.tech/documentation/scaling/distributed_deployment/#enabling-distributed-mode-in-self-hosted-qdrant
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P__PORT
              value: "6335"
            - name: QDRANT__STORAGE__COLLECTION__REPLICATION_FACTOR
              value: "3"
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: planifets-chatbot-secret
                  key: qdrant_api_key
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          # Initialize the Qdrant cluster with pod 0, then let the other peers join it
          command:
            - /bin/sh
            - -ec
            - |
              ordinal="${HOSTNAME##*-}"
              uri="http://${HOSTNAME}.planifets-chatbot-qdrant:6335"
              if [ "$ordinal" = "0" ]; then
                exec ./entrypoint.sh --uri "$uri"
              fi
              exec ./entrypoint.sh \
                --bootstrap "http://planifets-chatbot-qdrant-0.planifets-chatbot-qdrant:6335" \
                --uri "$uri"
          livenessProbe:
            tcpSocket:
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
            - name: tmp
              mountPath: /tmp
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteMany"] # for future growth and scaling
        storageClassName: cephfs
        resources:
          requests:
            storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: planifets-chatbot-qdrant-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: planifets-chatbot-qdrant
