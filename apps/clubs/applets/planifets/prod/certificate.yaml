apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: planifets-applets-tls
spec:
  secretName: planifets-applets-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  commonName: planifets.clubapplets.ca
  dnsNames:
    - planifets.clubapplets.ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: planifets-service-tls
spec:
  secretName: planifets-service-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  commonName: planifets.prodv2.cedille.club
  dnsNames:
    - planifets.prodv2.cedille.club
