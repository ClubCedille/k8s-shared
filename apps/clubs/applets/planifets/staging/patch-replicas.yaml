# Scale down to 1 replica in staging to save resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planifets
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planifets-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: planifets-backend
          env:
            - name: APP_ENV
              value: staging
