apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dci-outlinewiki
  namespace: argocd
  labels:
    k8s.cedille.club/club: dci
  annotations:
    k8s.cedille.club/club: dci
spec:
  destination:
    namespace: dci-outlinewiki
    server: https://kubernetes.default.svc
  project: k8s-shared
  source:
    path: apps/clubs/dci/outlinewiki/prod
    repoURL: https://github.com/ClubCedille/k8s-shared
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        k8s.cedille.club/club: dci
      annotations:
        k8s.cedille.club/club: dci
