apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dci-outlinewiki-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: dci-outlinewiki
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dci-outlinewiki
  annotations:
    kube-score/ignore: pod-networkpolicy, container-security-context-readonlyrootfilesystem, container-security-context-privileged, container-security-context-user-group-id, container-image-tag
spec:
  serviceName: dci-outlinewiki-svc
  replicas: 2
  selector:
    matchLabels:
      app: dci-outlinewiki
  template:
    metadata:
      labels:
        app: dci-outlinewiki
    spec:
      containers:
        - image: outlinewiki/outline:1.7.0
          name: outline
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: outline-secrets
            - configMapRef:
                name: outline-config
          env:
            - name: FILE_STORAGE
              value: s3
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_S3_UPLOAD_BUCKET_URL
              value: "http://10.0.21.59:7480"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_S3_ACL
              value: private
            - name: AWS_S3_UPLOAD_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: dci-outlinewiki-attachments
                  key: BUCKET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: dci-outlinewiki-attachments
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dci-outlinewiki-attachments
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /_health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: dockerhub-secret
      restartPolicy: Always
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: dci-outlinewiki-attachments
spec:
  generateBucketName: dci-outlinewiki-attachments
  storageClassName: ceph-bucket
---
apiVersion: v1
kind: Service
metadata:
  name: dci-outlinewiki-svc
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  clusterIP: None
  selector:
    app: dci-outlinewiki
