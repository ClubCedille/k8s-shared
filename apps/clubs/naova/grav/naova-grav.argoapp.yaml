apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: naova-grav
  namespace: argocd
  annotations:
    calidum-rotae.cedille.club/id: "abf48f98c19c16143efd0a76d7b2aaa16c203648"
    calidum-rotae.cedille.club/club: "naova"
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: website=ghcr.io/clubcedille/grav:latest
    argocd-image-updater.argoproj.io/website.update-strategy: digest
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: naova-grav
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: apps/clubs/naova/grav/prod
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
