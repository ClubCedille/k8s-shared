apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: cedille
spec:
  virtualhost:
    fqdn: cedille.etsmtl.ca
    tls:
      secretName: cedille-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: cedille-service
          port: 80
