apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: outline-cedille-wiki-tls
spec:
  secretName: outline-cedille-wiki-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  commonName: wiki.cedille.club
  dnsNames:
    - wiki.cedille.club
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: outline-cedille-wiki
spec:
  virtualhost:
    fqdn: wiki.cedille.club
    tls:
      secretName: outline-cedille-wiki-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: outline-cedille
          port: 3000
      timeoutPolicy:
        idle: 600s
        response: 600s
