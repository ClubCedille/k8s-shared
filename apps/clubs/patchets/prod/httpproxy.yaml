apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: commandes
spec:
  virtualhost:
    fqdn: commande.fraternitedupiranha.com
    tls:
      secretName: commande-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      timeoutPolicy:
        idle: 600s
        response: 600s
      services:
        - name: commandes
          port: 3000
