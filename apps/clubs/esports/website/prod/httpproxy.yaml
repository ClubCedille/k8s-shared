apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: esports
spec:
  virtualhost:
    fqdn: esports.prodv2.cedille.club
    tls:
      secretName: esports-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: esports-svc
          port: 80
