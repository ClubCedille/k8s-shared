apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-dronolab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: webapp=ghcr.io/dronolab/dronolab-website:latest
    argocd-image-updater.argoproj.io/webapp.update-strategy: digest
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-dronolab
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: apps/clubs/dronolab/website/prod
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: false
      prune: false