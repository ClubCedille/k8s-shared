apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: markets-ingress
spec:
  virtualhost:
    fqdn: markets.dev.cedille.club
    tls:
      secretName: markets-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /verification
      enableWebsockets: true
      services:
        - name: markets-backend-service
          port: 80
    - conditions:
        - prefix: /static
      enableWebsockets: true
      services:
        - name: markets-backend-service
          port: 80
    - conditions:
        - prefix: /admin
      enableWebsockets: true
      services:
        - name: markets-backend-service
          port: 80
    - conditions:
        - prefix: /api
      enableWebsockets: true
      services:
        - name: markets-backend-service
          port: 80
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: markets-frontend-service
          port: 80
