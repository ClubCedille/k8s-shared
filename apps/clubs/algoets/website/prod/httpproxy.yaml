apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: algoets-website
spec:
  virtualhost:
    fqdn: algoets.prodv2.cedille.club
    tls:
      secretName: algoets-website-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: algoets-website
          port: 80
