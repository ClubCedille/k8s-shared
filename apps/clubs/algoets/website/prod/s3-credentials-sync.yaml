# The ObjectBucketClaim (and the Secret/ConfigMap it generates) lives in the
# algoets-s3-bucket namespace. Kubernetes does not allow cross-namespace
# Secret/ConfigMap references, so copy the generated values into
# algoets-website and consume them there.
#
# The copy is done by a small in-cluster job instead of a cluster-wide secret
# replicator: the OBC-generated objects cannot be annotated from Git, and a
# replicator running with --allow-all would be able to read every Secret in the
# cluster. This job can only read the one OBC Secret/ConfigMap.
#
# ArgoCD owns the two placeholder objects below but ignores their /data field,
# so the values written at runtime do not cause persistent drift.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: algoets-s3-credentials-sync
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: algoets-s3-credentials-read
  namespace: algoets-s3-bucket
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    resourceNames: ["algoets-s3-bucket"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: algoets-s3-credentials-read
  namespace: algoets-s3-bucket
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: algoets-s3-credentials-read
subjects:
  - kind: ServiceAccount
    name: algoets-s3-credentials-sync
    namespace: algoets-website
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: algoets-s3-credentials-write
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    resourceNames: ["algoets-s3-bucket"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: algoets-s3-credentials-write
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: algoets-s3-credentials-write
subjects:
  - kind: ServiceAccount
    name: algoets-s3-credentials-sync
    namespace: algoets-website
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: algoets-s3-credentials-sync
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  sync.py: |
    import json
    import ssl
    import time
    import urllib.error
    import urllib.request

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = "https://kubernetes.default.svc"
    SOURCE_NAMESPACE = "algoets-s3-bucket"
    TARGET_NAMESPACE = "algoets-website"
    NAME = "algoets-s3-bucket"

    with open(f"{SA_DIR}/token", encoding="utf-8") as token_file:
        TOKEN = token_file.read().strip()
    SSL_CONTEXT = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")


    def request(method, path, body=None):
        data = json.dumps(body).encode("utf-8") if body is not None else None
        req = urllib.request.Request(API + path, data=data, method=method)
        req.add_header("Authorization", f"Bearer {TOKEN}")
        req.add_header("Accept", "application/json")
        if data is not None:
            req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, context=SSL_CONTEXT, timeout=30) as resp:
                return resp.status, json.loads(resp.read() or b"{}")
        except urllib.error.HTTPError as exc:
            raw = exc.read()
            try:
                payload = json.loads(raw or b"{}")
            except json.JSONDecodeError:
                payload = {"raw": raw.decode("utf-8", "replace")}
            return exc.code, payload


    def sync(kind, plural):
        source_url = f"/api/v1/namespaces/{SOURCE_NAMESPACE}/{plural}/{NAME}"
        status, source = request("GET", source_url)
        if status != 200:
            raise RuntimeError(
                f"cannot read source {kind} {SOURCE_NAMESPACE}/{NAME}: "
                f"HTTP {status}: {source}"
            )

        target_url = f"/api/v1/namespaces/{TARGET_NAMESPACE}/{plural}/{NAME}"
        status, target = request("GET", target_url)
        if status != 200:
            raise RuntimeError(
                f"cannot read target {kind} {TARGET_NAMESPACE}/{NAME}: "
                f"HTTP {status}: {target}"
            )

        # Keep the live metadata (resourceVersion, ArgoCD annotations, ...) and
        # replace only the payload copied from the OBC-generated object.
        target.setdefault("metadata", {}).pop("managedFields", None)
        target["data"] = source.get("data", {})
        if kind == "ConfigMap":
            if "binaryData" in source:
                target["binaryData"] = source["binaryData"]
            else:
                target.pop("binaryData", None)

        status, payload = request("PUT", target_url, target)
        if status != 200:
            raise RuntimeError(
                f"cannot update target {kind} {TARGET_NAMESPACE}/{NAME}: "
                f"HTTP {status}: {payload}"
            )
        print(
            f"synced {kind} {TARGET_NAMESPACE}/{NAME} "
            f"from {SOURCE_NAMESPACE}/{NAME}",
            flush=True,
        )


    for attempt in range(1, 4):
        try:
            sync("Secret", "secrets")
            sync("ConfigMap", "configmaps")
            break
        except RuntimeError as exc:
            if attempt == 3:
                raise SystemExit(str(exc))
            print(f"attempt {attempt} failed: {exc}; retrying", flush=True)
            time.sleep(2)
---
# Placeholders. ArgoCD creates the objects; the sync job fills /data and the
# ignoreDifferences rule in the Application prevents ArgoCD from reverting it.
apiVersion: v1
kind: Secret
metadata:
  name: algoets-s3-bucket
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: algoets-s3-bucket
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: algoets-s3-credentials-sync
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app: algoets-s3-credentials-sync
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - {}
---
# Runs once per Argo sync, before the Deployment, so the website never starts
# with an empty credentials Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: algoets-s3-credentials-sync
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: algoets-s3-credentials-sync
    spec:
      serviceAccountName: algoets-s3-credentials-sync
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: python:3.12-alpine
          imagePullPolicy: Always
          command: ["python", "/scripts/sync.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: algoets-s3-credentials-sync
        - name: tmp
          emptyDir: {}
---
# The OBC operator does not notify us when it rotates the credentials, so keep
# the copy in sync on a timer as well.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: algoets-s3-credentials-sync
  namespace: algoets-website
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app: algoets-s3-credentials-sync
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: algoets-s3-credentials-sync
        spec:
          serviceAccountName: algoets-s3-credentials-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.12-alpine
              imagePullPolicy: Always
              command: ["python", "/scripts/sync.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: algoets-s3-credentials-sync
            - name: tmp
              emptyDir: {}
