apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: ghcr-clubcedille-secret
spec:
  refreshPeriod: 1h0m0s
  refreshThreshold: 90
  syncOnResourceChange: false
  vaultSecretDefinitions:
    - authentication:
        path: kubernetes
        role: secret-reader
        serviceAccount:
          name: default
      name: docker
      path: kv-system/default_passwords/docker
      requestType: GET
  output:
    name: ghcr-clubcedille-secret
    stringData:
      .dockerconfigjson: '{{ b64dec .docker.config }}'
    type: kubernetes.io/dockerconfigjson
---
# Populate with:
#   vault kv put kv/algoets-website/default/config admin_password='<password>'
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: algoets-website-secrets
spec:
  refreshPeriod: 1h0m0s
  refreshThreshold: 90
  syncOnResourceChange: false
  vaultSecretDefinitions:
    - authentication:
        path: kubernetes
        role: secret-reader
        serviceAccount:
          name: default
      name: website
      path: kv/data/algoets-website/default/config
      requestType: GET
  output:
    name: algoets-website-secrets
    stringData:
      ADMIN_PASSWORD: '{{ .website.admin_password }}'
    type: opaque
