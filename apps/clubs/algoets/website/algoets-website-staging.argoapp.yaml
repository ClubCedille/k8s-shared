apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: algoets-website-staging
  namespace: argocd
  annotations:
    k8s.cedille.club/club: "algoets"
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: webapp=ghcr.io/clubcedille/algoets-website:staging
    argocd-image-updater.argoproj.io/webapp.update-strategy: digest
    argocd-image-updater.argoproj.io/webapp.pull-secret: pullsecret:argocd/ghcr-clubcedille-secret
  labels:
    k8s.cedille.club/club: algoets
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: algoets-website-staging
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: apps/clubs/algoets/website/staging
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    managedNamespaceMetadata:
      labels:
        k8s.cedille.club/club: algoets
      annotations:
        k8s.cedille.club/club: algoets
