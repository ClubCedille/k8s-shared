apiVersion: apps/v1
kind: Deployment
metadata:
  name: algoets-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: algoets-website
  template:
    metadata:
      labels:
        app: algoets-website
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-clubcedille-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: algoets-website
                topologyKey: kubernetes.io/hostname
      containers:
        - name: website
          image: ghcr.io/clubcedille/algoets-website:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: algoets-website-config
            - secretRef:
                name: algoets-website-secrets
          env:
            # The ObjectBucketClaim lives in this namespace so its generated
            # ConfigMap/Secret can be consumed without copying credentials.
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: algoets-s3-bucket
                  key: BUCKET_NAME
            - name: S3_BUCKET
              value: $(BUCKET_NAME)
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: algoets-s3-bucket
                  key: BUCKET_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: algoets-s3-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: algoets-s3-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: https://s3.algoets.etsmtl.club
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: MEDIA_BASE_URL
              value: https://s3.algoets.etsmtl.club/$(BUCKET_NAME)
            # Explicit refs (in addition to envFrom) so adding the SMTP keys
            # rolls the pods and the app starts with the relay configured.
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: algoets-website-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: algoets-website-secrets
                  key: SMTP_PASS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: algoets-website
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: algoets-website
