apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: algoets-website-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: webapp=ghcr.io/clubcedille/algoets-website:main
    argocd-image-updater.argoproj.io/webapp.update-strategy: digest
    argocd-image-updater.argoproj.io/webapp.pull-secret: pullsecret:argocd/ghcr-clubcedille-secret
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: algoets-website
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: apps/clubs/algoets/website/prod
    targetRevision: HEAD
  # The OBC-generated Secret/ConfigMap cannot cross namespaces, so a sync job
  # copies them into algoets-website. ArgoCD still owns the placeholder
  # objects but must not revert the data written at runtime.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: algoets-s3-bucket
      namespace: algoets-website
      jsonPointers:
        - /data
    - group: ""
      kind: ConfigMap
      name: algoets-s3-bucket
      namespace: algoets-website
      jsonPointers:
        - /data
        - /binaryData
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
      prune: true
