apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: algoets-website-staging
spec:
  virtualhost:
    fqdn: algoets-staging.prodv2.cedille.club
    tls:
      secretName: algoets-website-staging-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: algoets-website
          port: 80
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: algoets-website-staging-etsmtl
spec:
  virtualhost:
    fqdn: algoets.staging.etsmtl.ca
    tls:
      secretName: algoets-website-staging-etsmtl-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: algoets-website
          port: 80
