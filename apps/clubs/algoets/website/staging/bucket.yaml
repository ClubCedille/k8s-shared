# Bucket dedie au staging : le site ecrit son contenu et les messages de
# contact dans S3. Ne pas partager le bucket de production.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: algoets-s3-bucket
spec:
  generateBucketName: algoets-s3-bucket-staging
  storageClassName: ceph-bucket
