apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: algoets-s3-bucket
  namespace: argocd
spec:
  destination:
    namespace: algoets-s3-bucket
    server: https://kubernetes.default.svc
  project: k8s-shared
  source:
    path: apps/clubs/algoets/s3-bucket/resources
    repoURL: https://github.com/ClubCedille/k8s-shared
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
