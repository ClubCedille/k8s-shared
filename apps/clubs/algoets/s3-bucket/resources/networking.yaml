---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: algoets-s3-endpoint
  labels:
    kubernetes.io/service-name: algoets-s3-svc
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 7480
endpoints:
  - addresses:
      - 10.0.21.59
    conditions:
      ready: true
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: algoets-s3-httpproxy
spec:
  virtualhost:
    fqdn: s3.algoets.etsmtl.club
    tls:
      secretName: algoets-s3-tls
      minimumProtocolVersion: "1.3"
    corsPolicy:
      allowOrigin:
        - https://algoets.etsmtl.club
      allowMethods:
        - "*"
      allowHeaders:
        - "*"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: algoets-s3-svc
          port: 7480
      timeoutPolicy:
        idle: 600s
        response: 600s
