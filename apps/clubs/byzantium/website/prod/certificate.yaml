apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: byzantium-website-tls
spec:
  secretName: byzantium-website-tls
  issuerRef:
    name: letsencrypt-etsmtl
    kind: ClusterIssuer
  commonName: blockchain.etsmtl.club
  dnsNames:
    - blockchain.etsmtl.club
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: byzantium-website-ets-tls
spec:
  secretName: byzantium-website-ets-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  commonName: blockchain.etsmtl.ca
  dnsNames:
    - blockchain.etsmtl.ca
