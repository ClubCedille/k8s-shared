apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-provider
  annotations:
    kube-score/ignore: pod-probes-identical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cluster-provider
  template:
    metadata:
      labels:
        app: cluster-provider
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - cluster-provider
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: cluster-provider
          image: ghcr.io/clubcedille/cluster-provider:latest
          imagePullPolicy: Always
          command:
            ['/bin/sh', '-c', '/cluster_provider --port 7000']
          ports:
            - containerPort: 7000
          livenessProbe:
            tcpSocket:
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 7000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 1Gi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster-provider-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cluster-provider
