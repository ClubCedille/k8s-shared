apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: etshub
spec:
  virtualhost:
    fqdn: etshub.prodv2.cedille.club
    tls:
      secretName: etshub-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: etshub-svc
          port: 80
