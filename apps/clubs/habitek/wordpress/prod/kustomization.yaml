apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - httpproxy.yaml
  - certificate.yaml

namespace: habitek

patches:
  # Security maintenance: redirect both hosts and stop the PHP app.
  - target:
      kind: HTTPProxy
      name: habitek-prod-ingress
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - conditions:
              - prefix: /
            requestRedirectPolicy:
              hostname: maintenance.etsmtl.club
              scheme: https
              statusCode: 302
  - target:
      kind: HTTPProxy
      name: habitek-staging-ingress
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - conditions:
              - prefix: /
            requestRedirectPolicy:
              hostname: maintenance.etsmtl.club
              scheme: https
              statusCode: 302
  - target:
      kind: Deployment
      name: habitek-wordpress
    patch: |-
      - op: add
        path: /spec/replicas
        value: 0
