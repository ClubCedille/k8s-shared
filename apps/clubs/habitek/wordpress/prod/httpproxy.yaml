apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: habitek-prod-ingress
spec:
  virtualhost:
    fqdn: habitek.ca
    tls:
      secretName: habitek-prod-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: habitek-svc
          port: 80
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: habitek-staging-ingress
spec:
  virtualhost:
    fqdn: habitek.prodv2.cedille.club
    tls:
      secretName: habitek-staging-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: habitek-svc
          port: 80
