apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: integrale-website-ingress
spec:
  virtualhost:
    fqdn: integrale.etsmtl.ca
    tls:
      secretName: integrale-website-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: integrale-website-svc
          port: 3000
