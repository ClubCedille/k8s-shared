apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-inventree
  namespace: comets-inventree
spec:
  instances: 3
  bootstrap:
    initdb:
      database: inventree
      owner: inventree
  storage:
    storageClass: ceph-rbd
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi