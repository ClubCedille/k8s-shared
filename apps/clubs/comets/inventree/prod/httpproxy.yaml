apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: inventree
spec:
  virtualhost:
    fqdn: inventree.prodv2.cedille.club
    tls:
      secretName: inventree-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: inventree
          port: 80
          # Le nginx du chart force X-Forwarded-Proto a http (TLS termine ici).
          # On fournit le vrai schema sous un autre nom pour construire les
          # URL absolues (redirect_uri OIDC) en https.
          requestHeadersPolicy:
            set:
              - name: X-Original-Proto
                value: https