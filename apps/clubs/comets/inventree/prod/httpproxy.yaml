apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: inventree
spec:
  virtualhost:
    fqdn: inventree.prodv2.cedille.club
    tls:
      secretName: inventree-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: inventree
          port: 80