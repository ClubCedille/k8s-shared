apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventree
spec:
  template:
    spec:
      containers:
        - name: inventree
          env:
            - name: INVENTREE_TRUSTED_ORIGINS
              value: "https://inventree.prodv2.cedille.club"
            - name: INVENTREE_USE_X_FORWARDED_HOST
              value: "True"
            - name: INVENTREE_USE_X_FORWARDED_PROTO
              value: "True"
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: inventree.prodv2.cedille.club
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
        - name: inventree-proxy
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: Host
                  value: inventree.prodv2.cedille.club
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
