apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: inventree
  namespace: comets-inventree

namespace: comets-inventree

resources:
  - prod

helmCharts:
  - name: valkey
    releaseName: inventree-cache
    repo: https://valkey.io/valkey-helm/
    version: 0.9.3
    namespace: comets-inventree
    valuesFile: helm/valkey-values.yaml
  - name: inventree
    releaseName: inventree
    repo: https://inventree.github.io/helm-charts
    version: 0.4.36
    namespace: comets-inventree
    valuesFile: helm/values.yaml
patches:
  - path: patches/inventree-deployment.yaml
  - path: patches/inventree-worker.yaml

  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/managed-by=Helm
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kube-score/ignore: >-
            container-resources,
            container-ephemeral-storage-request-and-limit,
            container-security-context-user-group-id,
            pod-networkpolicy,
            container-image-tag,
            container-image-pull-policy

