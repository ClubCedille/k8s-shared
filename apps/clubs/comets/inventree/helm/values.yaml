fullnameOverride: inventree
replicaCount: 1

global:
  # TODO: remove this when the app is updated to use the new env vars.
  siteUrl: http://inventree.local
  adminSecret: inventree-admin
  dbSecrets:
    - name: INVENTREE_DB_ENGINE
      value: postgresql
    - name: INVENTREE_DB_HOST
      valueFrom:
        secretKeyRef:
          name: postgresql-inventree-app
          key: host
    - name: INVENTREE_DB_PORT
      valueFrom:
        secretKeyRef:
          name: postgresql-inventree-app
          key: port
    - name: INVENTREE_DB_NAME
      valueFrom:
        secretKeyRef:
          name: postgresql-inventree-app
          key: dbname
    - name: INVENTREE_DB_USER
      valueFrom:
        secretKeyRef:
          name: postgresql-inventree-app
          key: username
    - name: INVENTREE_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgresql-inventree-app
          key: password

image:
  tag: "1.5.7"

persistence:
  enabled: true
  storageClass: cephfs
  accessMode: ReadWriteMany
  size: 2Gi

ingress: {}
httpRoute:
  enabled: false

serviceAccount:
  automount: false