apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-acq

resources:
  - resources/certificate.yaml
  - resources/httpproxy.yaml

helmCharts:
  - name: influxdb2
    version: 2.1.2
    repo: https://helm.influxdata.com
    releaseName: influxdb2
    namespace: data-acq
    valuesFile: values.influxdb.yaml
  - name: grafana
    version: 10.5.15
    repo: https://grafana.github.io/helm-charts
    releaseName: grafana
    namespace: data-acq
    valuesFile: values.grafana.yaml

labels:
  - pairs:
      k8s.cedille.club/club: comets
    includeSelectors: false
    includeTemplates: true

commonAnnotations:
  k8s.cedille.club/club: comets
