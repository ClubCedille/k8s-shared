apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-acq-shared
  namespace: argocd
  annotations:
    k8s.cedille.club/club: "comets"
    argocd.argoproj.io/sync-wave: "2"
  labels:
    k8s.cedille.club/club: comets
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: data-acq
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    targetRevision: HEAD
    path: apps/clubs/comets/data_acq
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    managedNamespaceMetadata:
      labels:
        k8s.cedille.club/club: comets
      annotations:
        k8s.cedille.club/club: comets
