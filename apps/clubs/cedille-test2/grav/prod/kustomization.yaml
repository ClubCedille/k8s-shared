apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: cedille-test2-

resources:
  - ../../../../../bases/grav
  - vault-secret.yaml

patches:
  - path: vault-patch.yaml
  - target:
      kind: HTTPProxy
      name: grav-ingress
    patch: |-
      - op: replace
        path: /spec/virtualhost/fqdn
        value: cedille-test2.etsmtl.ca
      - op: replace
        path: /spec/virtualhost/tls/secretName
        value: cedille-test2-grav-tls
      - op: replace
        path: /spec/routes/0/services/0/name
        value: cedille-test2-grav
  - target:
      kind: Certificate
      name: grav-tls
    patch: |-
      - op: replace
        path: /spec/secretName
        value: cedille-test2-grav-tls
      - op: replace
        path: /spec/commonName
        value: cedille-test2.etsmtl.ca
      - op: replace
        path: /spec/dnsNames/0
        value: cedille-test2.etsmtl.ca
      - op: replace
        path: /spec/issuerRef/name
        value: letsencrypt-http
  - target:
      kind: RandomSecret
    patch: |-
      - op: replace
        path: /spec/path
        value: kv/data/cedille-test2-grav/default/grav
