apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjure-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjure-service
  template:
    metadata:
      labels:
        app: conjure-service
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: conjure-service
          image: ghcr.io/conjureets/conjure-site:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: run-dir
              mountPath: /run
            # Next.js image optimizer / ISR writes here. The root filesystem is
            # read-only, so without this emptyDir it fails with
            # "ENOENT: mkdir '/app/.next/cache'" and keeps restarting.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: run-dir
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
