environment:
  analytics:
    - name: LOGFLARE_NODE_HOST
      value: "127.0.0.1"
    - name: DB_USERNAME
      value: "supabase_admin"
    - name: DB_DATABASE
      value: "_supabase"
    - name: DB_PORT
      value: "5432"
    - name: DB_DRIVER
      value: "postgresql"
    - name: DB_SCHEMA
      value: "_analytics"
    - name: POSTGRES_BACKEND_SCHEMA
      value: "_analytics"
    - name: LOGFLARE_SINGLE_TENANT
      value: "true"
    - name: LOGFLARE_SUPABASE_MODE
      value: "true"
    - name: LOGFLARE_FEATURE_FLAG_OVERRIDE
      value: "multibackend=true"

  auth:
    - name: DB_USER
      value: "supabase_auth_admin"
    - name: DB_PORT
      value: "5432"
    - name: DB_DRIVER
      value: "postgres"
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    - name: DB_SSL
      value: "disable"
    - name: API_EXTERNAL_URL
      value: "https://supabase.exutoire.etsmtl.club"
    - name: GOTRUE_API_HOST
      value: "0.0.0.0"
    - name: GOTRUE_API_PORT
      value: "9999"
    - name: GOTRUE_SITE_URL
      value: "https://supabase.exutoire.etsmtl.club"
    - name: GOTRUE_URI_ALLOW_LIST
      value: "*"
    - name: GOTRUE_DISABLE_SIGNUP
      value: "false"
    - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
      value: "authenticated"
    - name: GOTRUE_JWT_ADMIN_ROLES
      value: "service_role"
    - name: GOTRUE_JWT_AUD
      value: "authenticated"
    - name: GOTRUE_JWT_EXP
      value: "3600"
    - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
      value: "true"
    - name: GOTRUE_MAILER_AUTOCONFIRM
      value: "true"
    - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
      value: "false"
    # GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: true
    # GOTRUE_SMTP_MAX_FREQUENCY: 1s
    - name: GOTRUE_SMTP_ADMIN_EMAIL
      value: "SMTP_ADMIN_MAIL"
    - name: GOTRUE_SMTP_HOST
      value: "SMTP_HOST"
    - name: GOTRUE_SMTP_PORT
      value: "123"
    - name: GOTRUE_EXTERNAL_PHONE_ENABLED
      value: "false"
    - name: GOTRUE_SMS_AUTOCONFIRM
      value: "false"
    - name: GOTRUE_SMTP_SENDER_NAME
      value: "SMTP_SENDER_NAME"
    - name: GOTRUE_MAILER_URLPATHS_INVITE
      value: "/auth/v1/verify"
    - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
      value: "/auth/v1/verify"
    - name: GOTRUE_MAILER_URLPATHS_RECOVERY
      value: "/auth/v1/verify"
    - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
      value: "/auth/v1/verify"
    ## Uncomment to enable custom access token hook. Please see: https://supabase.com/docs/guides/auth/auth-hooks
    ## for full list of hooks and additional details about custom_access_token_hook
    # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
    # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
    # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_SECRETS: "<standard-base64-secret>"
    # GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "true"
    # GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/public/mfa_verification_attempt"
    # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
    # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/public/password_verification_attempt"
    # GOTRUE_HOOK_SEND_SMS_ENABLED: "false"
    # GOTRUE_HOOK_SEND_SMS_URI: "pg-functions://postgres/public/custom_access_token_hook"
    # GOTRUE_HOOK_SEND_SMS_SECRETS: "v1,whsec_VGhpcyBpcyBhbiBleGFtcGxlIG9mIGEgc2hvcnRlciBCYXNlNjQgc3RyaW5n"
    # GOTRUE_HOOK_SEND_EMAIL_ENABLED: "false"
    # GOTRUE_HOOK_SEND_EMAIL_URI: "http://host.docker.internal:54321/functions/v1/email_sender"
    # GOTRUE_HOOK_SEND_EMAIL_SECRETS: "v1,whsec_VGhpcyBpcyBhbiBleGFtcGxlIG9mIGEgc2hvcnRlciBCYXNlNjQgc3RyaW5n"

  db:
    - name: POSTGRES_HOST
      value: "/var/run/postgresql"
    - name: PGPORT
      value: "5432"
    - name: POSTGRES_PORT
      value: "5432"
    - name: JWT_EXP
      value: "3600"
    # POSTGRES_HOST_AUTH_METHOD: md5
    ## Enable SSL for postgres by specifying paths for mounted certificate key pair
    # POSTGRES_SSL_CERT: /path/to/ssl/server.crt
    # POSTGRES_SSL_KEY: /path/to/ssl/server.key

  functions:
    - name: DB_USERNAME
      value: "postgres"
    - name: DB_PORT
      value: "5432"
    - name: DB_DRIVER
      value: "postgresql"
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    - name: DB_SSL
      value: "disable"
    - name: VERIFY_JWT
      value: "false"

  imgproxy:
    - name: IMGPROXY_BIND
      value: ":5001"
    - name: IMGPROXY_USE_ETAG
      value: "true"
    - name: IMGPROXY_ENABLE_WEBP_DETECTION
      value: "true"
    - name: IMGPROXY_USE_S3
      value: "true"
    - name: IMGPROXY_S3_ENDPOINT
      value: "http://10.0.21.50:3900"
    - name: IMGPROXY_S3_REGION
      value: "garage"

  kong:
    - name: KONG_DATABASE
      value: "off"
    - name: KONG_DECLARATIVE_CONFIG
      value: "/usr/local/kong/kong.yml"
    ## https://github.com/supabase/cli/issues/14
    - name: KONG_DNS_ORDER
      value: "LAST,A,CNAME"
    - name: KONG_PLUGINS
      value: "request-transformer,cors,key-auth,acl,basic-auth"
    - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
      value: "160k"
    - name: KONG_NGINX_PROXY_PROXY_BUFFERS
      value: "64 160k"
    - name: KONG_LOG_LEVEL
      value: "warn"

  meta:
    - name: DB_USER
      value: "supabase_admin"
    - name: DB_PORT
      value: "5432"
    - name: DB_DRIVER
      value: "postgres"
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    - name: DB_SSL
      value: "disable"
    - name: PG_META_PORT
      value: "8080"

  minio: []

  realtime:
    - name: DB_USER
      value: "supabase_admin"
    - name: DB_PORT
      value: "5432"
    ## Set to true to enforce TLS connections to Postgres
    - name: DB_SSL
      value: "false"
    - name: PORT
      value: "4000"
    - name: FLY_ALLOC_ID
      value: "fly123"
    - name: FLY_APP_NAME
      value: "realtime"
    - name: ENABLE_TAILSCALE
      value: "false"
    - name: DB_AFTER_CONNECT_QUERY
      value: "SET search_path TO _realtime"
    - name: DB_ENC_KEY
      value: "supabaserealtime"
    - name: ERL_AFLAGS
      value: "-proto_dist inet_tcp"
    - name: DNS_NODES
      value: "''"
    - name: RLIMIT_NOFILE
      value: "10000"
    - name: APP_NAME
      value: "realtime"
    - name: SEED_SELF_HOST
      value: "true"
    - name: RUN_JANITOR
      value: "true"

  rest:
    - name: DB_USER
      value: "authenticator"
    - name: DB_PORT
      value: "5432"
    - name: DB_DRIVER
      value: "postgres"
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    - name: DB_SSL
      value: "disable"
    - name: PGRST_DB_SCHEMAS
      value: "public,storage,graphql_public"
    - name: PGRST_DB_ANON_ROLE
      value: "anon"
    - name: PGRST_DB_USE_LEGACY_GUCS
      value: "false"
    - name: PGRST_APP_SETTINGS_JWT_EXP
      value: "3600"
    - name: PGRST_DB_USE_LEGACY_GUC_TUPLE_LIMIT
      value: "true"
    - name: PGRST_SERVER_CORS_ALLOWED_ORIGINS
      value: "http://localhost:5173"
    - name: PGRST_SERVER_CORS_ALLOWED_METHODS
      value: "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD"
    - name: PGRST_SERVER_CORS_ALLOWED_HEADERS
      value: "Authorization, content-type, accept-profile, apikey, prefer, range, x-requested-with"

  storage:
    - name: DB_USER
      value: "supabase_storage_admin"
    - name: DB_PORT
      value: "5432"
    - name: DB_DRIVER
      value: "postgres"
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
