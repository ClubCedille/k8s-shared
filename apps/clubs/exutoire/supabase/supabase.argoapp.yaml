apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exutoire-supabase
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    k8s.cedille.club/club: exutoire
  labels:
    k8s.cedille.club/club: exutoire
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: exutoire
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared.git
    path: apps/clubs/exutoire/supabase
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    managedNamespaceMetadata:
      labels:
        k8s.cedille.club/club: exutoire
      annotations:
        k8s.cedille.club/club: exutoire
