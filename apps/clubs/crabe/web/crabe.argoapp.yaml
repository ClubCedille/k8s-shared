apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-crabe-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: webapp=ghcr.io/crabe-etsmtl/crabe-atelier:latest,mysql=ghcr.io/crabe-etsmtl/crabe-mysql:latest
    argocd-image-updater.argoproj.io/webapp.update-strategy: digest
    argocd-image-updater.argoproj.io/mysql.update-strategy: digest
    argocd-image-updater.argoproj.io/webapp.pull-secret: pullsecret:argocd/ghcr-crabe-secret
    argocd-image-updater.argoproj.io/mysql.pull-secret: pullsecret:argocd/ghcr-crabe-secret
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-crabe
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: apps/clubs/crabe/web/prod
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-crabe-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: webapp=ghcr.io/crabe-etsmtl/crabe-atelier:staging,mysql=ghcr.io/crabe-etsmtl/crabe-mysql:latest
    argocd-image-updater.argoproj.io/webapp.update-strategy: digest
    argocd-image-updater.argoproj.io/mysql.update-strategy: digest
    argocd-image-updater.argoproj.io/webapp.pull-secret: pullsecret:argocd/ghcr-crabe-secret
    argocd-image-updater.argoproj.io/mysql.pull-secret: pullsecret:argocd/ghcr-crabe-secret
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-crabe-staging
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    path: apps/clubs/crabe/web/staging
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
