apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-crabe-env
data:
  APP_NAME: "Laravel"
  APP_ENV: "production"
  APP_DEBUG: "true"
  APP_URL: "https://staging.atelier.crabe.cedille.club"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: "debug"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "crabedb"
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "60"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  TELESCOPE_ENABLED: "true"
  VITE_APP_NAME: "Laravel"
  EMAIL_ADDRESS: "crabe@ens.etsmtl.ca"
  VERSION_NUMBER: "1.0.2"
