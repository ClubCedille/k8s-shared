apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - ingress.yaml
  - httpproxy.yaml
  - certificate.yaml

namespace: veloom

patches:
  # Security maintenance: redirect both hosts and stop the PHP app.
  - target:
      kind: HTTPProxy
      name: evovelo
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - conditions:
              - prefix: /
            requestRedirectPolicy:
              hostname: maintenance.etsmtl.club
              scheme: https
              statusCode: 302
  - target:
      kind: HTTPProxy
      name: veloom-staging-ingress
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - conditions:
              - prefix: /
            requestRedirectPolicy:
              hostname: maintenance.etsmtl.club
              scheme: https
              statusCode: 302
  - target:
      kind: Deployment
      name: veloom-wordpress
    patch: |-
      - op: add
        path: /spec/replicas
        value: 0
