apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: forom-ingress-prod
spec:
  virtualhost:
    fqdn: forom.etsmtl.ca
    tls:
      secretName: forom-tls-prod
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: forom-service
          port: 8080
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: forom-ingress
spec:
  virtualhost:
    fqdn: forom.prodv2.cedille.club
    tls:
      secretName: forom-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: forom-service
          port: 8080
