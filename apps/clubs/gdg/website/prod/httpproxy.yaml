apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: gdg
spec:
  virtualhost:
    fqdn: gdg.etsmtl.club
    tls:
      secretName: gdg-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: gdg-service
          port: 80
