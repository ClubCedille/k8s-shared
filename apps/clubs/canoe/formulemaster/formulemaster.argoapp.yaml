apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: formulemaster
  namespace: argocd
  labels:
    k8s.cedille.club/club: canoe
  annotations:
    k8s.cedille.club/club: canoe
spec:
  project: k8s-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: formulemaster
  source:
    repoURL: https://github.com/ClubCedille/k8s-shared
    targetRevision: main
    path: apps/clubs/canoe/formulemaster/prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        k8s.cedille.club/club: canoe
      annotations:
        k8s.cedille.club/club: canoe
