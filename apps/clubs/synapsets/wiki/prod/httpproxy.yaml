apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: wikijs
spec:
  virtualhost:
    fqdn: wiki.synapsets.prodv2.cedille.club
    tls:
      secretName: wikijs-cert-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: wiki
          port: 80
