---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  destination:
    namespace: trivy-operator
    server: https://kubernetes.default.svc
  project: k8s-shared
  sources:
    - path: apps/trivy-operator
      repoURL: https://github.com/ClubCedille/k8s-shared.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
