# VaultSecret -> crée ghcr-clubcedille-secret (credentials GHCR du Club
# Cedille), référencé par operator.privateRegistryScanSecretsNames pour
# authentifier les scan jobs sur les registres privés.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: ghcr-clubcedille-secret
spec:
  refreshPeriod: 1h0m0s
  refreshThreshold: 90
  syncOnResourceChange: false
  vaultSecretDefinitions:
    - authentication:
        path: kubernetes
        role: secret-reader
        serviceAccount:
          name: default
      name: docker
      path: kv-system/default_passwords/docker
      requestType: GET
  output:
    name: ghcr-clubcedille-secret
    stringData:
      .dockerconfigjson: '{{ b64dec .docker.config }}'
    type: kubernetes.io/dockerconfigjson
