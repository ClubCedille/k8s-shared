apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-page
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Maintenance en cours - CEDILLE</title>
      <style>
        :root {
          color-scheme: dark;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #111318;
          color: #f5f5f5;
        }
        main {
          max-width: 42rem;
          padding: 2.5rem;
          border: 1px solid #2c313c;
          border-radius: 1rem;
          background: #191c24;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        h1 {
          margin: 0 0 1rem;
          font-size: clamp(1.8rem, 4vw, 2.6rem);
          color: #e40032;
        }
        p {
          margin: 0.75rem 0;
          line-height: 1.6;
          color: #d6d9e0;
        }
        .muted {
          margin-top: 1.5rem;
          font-size: 0.9rem;
          color: #9298a6;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>Maintenance en cours</h1>
        <p>Une mise à jour de sécurité est en cours sur nos sites PHP.</p>
        <p>Les services seront de nouveau disponibles sous peu. Merci de votre patience.</p>
        <p class="muted">Équipe TI — CEDILLE</p>
      </main>
    </body>
    </html>
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      add_header Cache-Control "no-store" always;

      location / {
        try_files $uri /index.html;
      }
    }
