# Only the log-push path is exposed externally -- Grafana reads Loki
# in-cluster via Service DNS (loki-gateway), so no read-path route is
# needed here. BasicAuth is enforced by the chart's own nginx gateway (see
# helm/values.yaml gateway.basicAuth), not by Contour.
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: loki
spec:
  virtualhost:
    fqdn: loki.etsmtl.club
    tls:
      secretName: loki-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /loki/api/v1/push
      services:
        - name: loki-gateway
          port: 80
