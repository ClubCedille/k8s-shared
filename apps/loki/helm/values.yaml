# Loki single-binary mode for the centralized monitoring stack -- see the
# Grafana/Mimir/Loki plan (Plateforme-Cedille#654 phase 2). Based on the
# chart's official single-binary-values.yaml preset. Only the write path
# (gateway -> single-binary, routed at loki.etsmtl.club/loki/api/v1/push)
# is exposed externally; Grafana queries this in-cluster via the
# loki-gateway Service.

loki:
  # Loki enforces its own multi-tenancy independently of Mimir (X-Scope-OrgID
  # header required by default) -- confirmed live: dashboards querying Loki
  # failed with "no org id" even after fixing the equivalent Mimir setting.
  # Verified directly against pkg/loki/loki.go (v3.6.12 tag): AuthEnabled is
  # a genuine flat root field here (yaml:"auth_enabled"), unlike Mimir where
  # the analogous field is named multitenancy_enabled -- don't assume the
  # two charts share a field name just because they share a vendor.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-09-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  tracing:
    enabled: false
  querier:
    # 2 (défaut single-binary) suffisait pour un seul petit émetteur syslog --
    # avec apps/alloy-logs qui ajoute la collecte de tous les pods du cluster
    # et un usage staff régulier (dashboards + Explore), ça sature vite.
    # Valeur de départ, à recalibrer avec la charge réelle comme le reste de
    # ce bloc.
    max_concurrent: 8
  # Retention policy (2026-09-04): 90 days, working number pending a
  # recalibration once the OPNsense syslog sources (system+firewall+CARP/HA,
  # no allowlist, added same day) have run long enough to give a real
  # ingestion-rate baseline -- see project_cedille_infra_review_2026-09
  # memory for the volume projection this was based on. Compaction/retention
  # runs inside the single-binary pod itself in this deployment mode (the
  # top-level `compactor: replicas: 0` below is unrelated -- it just
  # disables the separate microservices-mode Deployment, standard for
  # SingleBinary). delete_request_store must match the object_store above
  # (s3) -- the chart refuses to start with retention_enabled=true otherwise.
  #
  # RETENTION NOT RECALIBRATED YET (2026-09-17): apps/alloy-logs ajoute la
  # collecte de tous les pods du cluster en plus des sources syslog qui ont
  # motivé ce chiffre -- décision de garder 90 jours tel quel le temps
  # d'observer 1-2 semaines de volume réel (viser ~2026-10-01) avant de
  # recalibrer ce champ ET les limites d'ingestion ci-dessous ensemble.
  limits_config:
    retention_period: 2160h # 90 days -- voir note ci-dessus, à revisiter ~2026-10-01
    # Défauts du chart calibrés pour un seul petit émetteur syslog -- avec
    # apps/alloy-logs qui ajoute la collecte de tous les pods du cluster
    # (~30 apps de clubs + système), ils sont atteints très vite. Valeurs de
    # départ raisonnables pour un cluster communautaire à faible/moyen
    # débit, PAS mesurées sur charge réelle -- à recalibrer avec la
    # rétention ci-dessus une fois 1-2 semaines de volume réel observées.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 15MB
  compactor:
    retention_enabled: true
    delete_request_store: s3
  storage:
    bucketNames:
      chunks: "${BUCKET_NAME}"
      ruler: "${BUCKET_NAME}"
    s3:
      endpoint: "${BUCKET_HOST}:${BUCKET_PORT}"
      accessKeyId: "${AWS_ACCESS_KEY_ID}"
      secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      s3ForcePathStyle: true
      insecure: true

# Pas de PDB par défaut dans le chart pour singleBinary : loki tourne en
# instance unique (replicas:1), un drain de node l'évincerait sans aucun
# signal. On force un budget bloquant plutôt qu'un silence -- voir le
# chantier drain-safety k8s-shared.
podDisruptionBudget:
  maxUnavailable: 0

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  # single-binary's statefulset reads its own extraArgs, not global.extraArgs
  # (unlike every other deployment mode's templates) -- confirmed against
  # the chart's single-binary/statefulset.yaml template.
  extraArgs:
    - "-config.expand-env=true"
  # Bucket credentials + endpoint from the ObjectBucketClaim in
  # resources/objectbucketclaim.yaml (Secret/ConfigMap named after the OBC:
  # loki-chunks), resolved into the ${BUCKET_*}/${AWS_*} placeholders above
  # via -config.expand-env=true.
  extraEnvFrom:
    - configMapRef:
        name: loki-chunks
    - secretRef:
        name: loki-chunks
  # Dimensionné à l'origine pour un seul petit émetteur syslog -- bump pour
  # absorber la collecte de tous les pods du cluster via apps/alloy-logs.
  # Ordre de grandeur de départ, PAS mesuré sur charge réelle -- à recalibrer
  # avec les limites d'ingestion et la rétention ci-dessus (viser ~2026-10-01).
  resources:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 1
      memory: 1Gi
  persistence:
    storageClass: ceph-rbd

chunksCache:
  writebackSizeLimit: 10MB

# Enable minio for storage
minio:
  enabled: false

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  basicAuth:
    enabled: true
    # Precomputed by terraform/monitoring/push-auth-vault, synced in by
    # resources/vault.yaml. Must contain a '.htpasswd' key.
    existingSecret: loki-push-htpasswd
