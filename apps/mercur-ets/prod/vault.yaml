apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mercur-auth
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    audiences:
      - vault
    role: secret-reader
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mercur-secrets
spec:
  vaultAuthRef: mercur-auth
  type: kv-v1
  mount: kv
  path: data/mercur-ets/default/mercur-secrets
  destination:
    name: mercur-secrets
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: b2-creds
spec:
  vaultAuthRef: mercur-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/b2-creds
  destination:
    name: b2-creds
    create: true
