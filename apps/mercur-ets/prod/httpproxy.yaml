apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: mercur-storefront
spec:
  virtualhost:
    fqdn: mercur.etsmtl.club
    tls:
      secretName: mercur-ets-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: mercur-storefront
          port: 3000
      timeoutPolicy:
        idle: 600s
        response: 600s
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: mercur-api
spec:
  virtualhost:
    fqdn: api.mercur.etsmtl.club
    tls:
      secretName: mercur-ets-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: mercur-api-server
          port: 9000
      timeoutPolicy:
        idle: 600s
        response: 600s
