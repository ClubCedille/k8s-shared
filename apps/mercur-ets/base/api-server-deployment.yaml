apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercur-api-server
  labels:
    app.kubernetes.io/name: mercur-api
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mercur-api
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mercur-api
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api-server
          image: ghcr.io/clubcedille/mercur-ets/api:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "start"]
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mercur-api-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "9000"
            - name: MEDUSA_WORKER_MODE
              value: "server"
            - name: DISABLE_MEDUSA_ADMIN
              value: "false"

            # PostgreSQL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-mercur-ets-app
                  key: uri

            # Secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercur-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercur-secrets
                  key: COOKIE_SECRET
            - name: STOREFRONT_REVALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercur-secrets
                  key: STOREFRONT_REVALIDATE_SECRET
                  optional: true

            # S3 Object Storage
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: mercur-ets-attachments
                  key: BUCKET_NAME
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mercur-ets-attachments
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mercur-ets-attachments
                  key: AWS_SECRET_ACCESS_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
