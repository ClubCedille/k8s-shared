apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercur-storefront
  labels:
    app.kubernetes.io/name: mercur-storefront
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mercur-storefront
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mercur-storefront
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: storefront
          image: ghcr.io/clubcedille/mercur-ets/storefront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mercur-storefront-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"

            # Secrets
            - name: MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: mercur-secrets
                  key: MEDUSA_PUBLISHABLE_KEY
                  optional: true
            - name: REVALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercur-secrets
                  key: REVALIDATE_SECRET
                  optional: true

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
