apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-summercamp-infra
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "SummerCamp"
data:
  summercamp-infra.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
