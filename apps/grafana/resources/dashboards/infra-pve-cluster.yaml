            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "count(count by (id) (pve_up{job=\"pve_cluster\",id=~\"node/.+\"} == 1))",
