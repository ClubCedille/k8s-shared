apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-app-logs-overview
  labels:
    grafana_dashboard: "1"
  annotations:
    # Dossier dédié (staff uniquement, voir terraform/grafana/access) --
    # distinct de "Infra/Logs" pour ne pas mélanger logs d'infra et logs
    # applicatifs sous la même permission.
    k8s-sidecar-target-directory: "Kubernetes/App-Logs"
data:
  k8s-app-logs-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Logs applicatifs de tous les pods du cluster (apps/alloy-logs) via Loki",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "logs/s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace) (count_over_time({namespace=~\"$namespace\"}[$__interval]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "title": "Volume de logs par namespace",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "logs/s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (app) (count_over_time({namespace=~\"$namespace\", app=~\"$app\"}[$__interval]))",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "title": "Volume de logs par app",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 3,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{namespace=~\"$namespace\", app=~\"$app\", container=~\"$container\"} |~ \"$search\"",
              "refId": "A"
            }
          ],
          "title": "Tous les logs",
          "type": "logs"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "kubernetes",
        "logs"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 2,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "definition": "label_values(namespace)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "label": "Namespace",
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "definition": "label_values({namespace=~\"$namespace\"}, app)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "name": "app",
            "options": [],
            "query": {
              "query": "label_values({namespace=~\"$namespace\"}, app)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "label": "App",
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "definition": "label_values({namespace=~\"$namespace\", app=~\"$app\"}, container)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "name": "container",
            "options": [],
            "query": {
              "query": "label_values({namespace=~\"$namespace\", app=~\"$app\"}, container)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "label": "Container",
            "type": "query"
          },
          {
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0,
            "label": "Search",
            "name": "search",
            "options": [
              {
                "text": "",
                "value": "",
                "selected": true
              }
            ],
            "query": "",
            "skipUrlSync": false,
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Kubernetes — App Logs Overview",
      "uid": "k8s-app-logs-overview",
      "version": 1,
      "weekStart": ""
    }
