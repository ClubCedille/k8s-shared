      "schemaVersion": 39,
      "tags": ["infra", "network", "snmp"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 2,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "definition": "label_values(ifHCInOctets, instance)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "instance",
            "options": [],
            "query": {"query": "label_values(ifHCInOctets, instance)", "refId": "StandardVariableQuery"},
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "label": "Switch",
            "allValue": ".*"
