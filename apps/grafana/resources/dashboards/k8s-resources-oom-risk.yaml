          "description": "Recensement de tous les conteneurs avec requests/limits (kube-state-metrics), usage moyen et pic sur $window (cAdvisor) et nombre de OOM kills sur $window. req/use élevé = sur-provisionnement (gaspillage) ; % limite / pic % limite élevé = service stressé. Cliquez sur un en-tête de colonne pour trier (ex. OOM kills ou RAM pic % limite).",
