# Dashboard de recensement des ressources Kubernetes (requests/limits/usage)
# et de détection des OOM kills / sur-provisionnement.
#
# Généré et maintenu sous forme de JSON dans ce ConfigMap ; le sidecar Grafana
# (grafana_dashboard: "1") le provisionne dans le dossier Kubernetes/Resources.
# Voir docs/k8s-resource-dashboard/README.md pour les prérequis de collecte
# (kube-state-metrics + /metrics/cadvisor) et l'interprétation des ratios.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-resources-oom-risk
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Kubernetes/Resources"
data:
  k8s-resources-oom-risk.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Recensement des requests/limits et de l'usage CPU/mémoire de tous les conteneurs du cluster, avec détection des OOM kills (cAdvisor) et des demandes disproportionnées. PRÉREQUIS : kube-state-metrics et le scrape /metrics/cadvisor des kubelets doivent être actifs dans apps/prometheus/helm/values.yaml (voir docs/k8s-resource-dashboard).",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Nombre de conteneurs avec requests CPU (tous namespaces / filtres).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "count(avg by (namespace, pod, container) (kube_pod_container_resource_requests{cluster=\"k8s-shared\",namespace=~\"$namespace\",pod=~\"$search\",resource=\"cpu\"}))",
              "format": "time_series",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Conteneurs observés",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Somme des requests CPU — le plancher garanti à l'ordonnanceur.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "sum(avg by (namespace, pod, container) (kube_pod_container_resource_requests{cluster=\"k8s-shared\",namespace=~\"$namespace\",pod=~\"$search\",resource=\"cpu\"}))",
              "format": "time_series",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "CPU demandé (cores)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Somme des requests mémoire.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "sum(avg by (namespace, pod, container) (kube_pod_container_resource_requests{cluster=\"k8s-shared\",namespace=~\"$namespace\",pod=~\"$search\",resource=\"memory\"}))",
              "format": "time_series",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Mémoire demandée",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Total des événements OOM rapportés par cAdvisor sur la période.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "sum(increase(container_oom_events_total{cluster=\"k8s-shared\",namespace=~\"$namespace\",pod=~\"$search\",container!=\"\",pod!=\"\"}[$window]))",
              "format": "time_series",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "OOM kills sur $window",
          "type": "stat"
