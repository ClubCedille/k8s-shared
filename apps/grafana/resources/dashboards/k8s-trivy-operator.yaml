# Dashboard officiel "Trivy Operator Dashboard" (grafana.com #17813,
# uid ycwPj724k), adapté pour le provisioning : la datasource est une variable
# de templating (${datasource}, défaut = Mimir) au lieu d'un __input d'import.
#
# Retravaillé le 2026-11-17 : les métriques trivy_* sont des GAUGES (valeurs
# absolues au moment du scrape), pas des compteurs cumulatifs. Le problème
# initial était double : (1) sum() comptait chaque image une fois par workload
# qui la porte (Pod + ReplicaSet + ...) → valeurs ~2x trop hautes ; les images
# sont maintenant dédupliquées par image_digest ; (2) les données historiques
# sont trouées (l'opérateur ne scrape pas en continu), donc un total qui
# « monte dans le temps » reflète le re-scan en cours, pas un compteur.
# Les panels RBAC combinent désormais Roles + ClusterRoles (la sévérité Unknown
# est supprimée, ces métriques n'exposent pas d'Unknown).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-trivy-operator
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Kubernetes"
