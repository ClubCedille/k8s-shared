apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra-opnsense
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Infra"
data:
  infra-opnsense.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {"list": []},
      "description": "OPNsense CARP cluster — os-telegraf metrics (CPU/mem/net) via the local Prometheus on monitoring01, remote_written to Mimir. No PF state metrics: os-telegraf's pf input has no exposed sudo/privilege config, only works as root.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["infra", "opnsense", "router"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 2,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "definition": "label_values(system_uptime{job=\"opnsense_telegraf\"}, instance)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "instance",
            "options": [],
            "query": {
              "query": "label_values(system_uptime{job=\"opnsense_telegraf\"}, instance)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "label": "Node",
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Infra — OPNsense",
      "uid": "infra-opnsense",
      "version": 1,
      "weekStart": "",
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 80},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "100 - avg by (instance) (rate(cpu_usage_idle{job=\"opnsense_telegraf\",instance=~\"$instance\",cpu=\"cpu-total\"}[5m]))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "CPU Usage",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 80},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "100 * (1 - avg by (instance) (mem_available{job=\"opnsense_telegraf\",instance=~\"$instance\"} / mem_total{job=\"opnsense_telegraf\",instance=~\"$instance\"}))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "Memory Usage",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "unit": "bps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 3,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "rate(net_bytes_recv{job=\"opnsense_telegraf\",instance=~\"$instance\"}[5m]) * 8",
              "legendFormat": "{{instance}} {{interface}} rx",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "rate(net_bytes_sent{job=\"opnsense_telegraf\",instance=~\"$instance\"}[5m]) * 8",
              "legendFormat": "{{instance}} {{interface}} tx",
              "refId": "B"
            }
          ],
          "title": "Interface Traffic",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "unit": "pps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 4,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "rate(net_err_in{job=\"opnsense_telegraf\",instance=~\"$instance\"}[5m])",
              "legendFormat": "{{instance}} {{interface}} err_in",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "rate(net_err_out{job=\"opnsense_telegraf\",instance=~\"$instance\"}[5m])",
              "legendFormat": "{{instance}} {{interface}} err_out",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "rate(net_drop_in{job=\"opnsense_telegraf\",instance=~\"$instance\"}[5m])",
              "legendFormat": "{{instance}} {{interface}} drop_in",
              "refId": "C"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "rate(net_drop_out{job=\"opnsense_telegraf\",instance=~\"$instance\"}[5m])",
              "legendFormat": "{{instance}} {{interface}} drop_out",
              "refId": "D"
            }
          ],
          "title": "Interface Errors & Drops",
          "type": "timeseries"
        }
      ]
    }
