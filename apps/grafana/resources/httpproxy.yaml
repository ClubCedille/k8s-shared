apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: grafana
spec:
  virtualhost:
    fqdn: grafana.etsmtl.club
    tls:
      secretName: grafana-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: grafana
          port: 80
