apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-templates
data:
  templates.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: k8s-alerts
        template: |
          {{ define "k8s.title" -}}
          {{ if eq .Status "firing" }}ALERTE {{ else }}RÉSOLUE {{ end -}}
          · {{ if .CommonLabels.cluster }}{{ .CommonLabels.cluster }}{{ else }}cluster inconnu{{ end }}
          {{- end -}}

          {{ define "k8s.message" -}}
          {{- range $i, $alert := .Alerts -}}
          {{- if $i }}

          {{ end -}}
          **{{ $alert.Annotations.summary }}**

          - **cluster** `{{ if $alert.Labels.cluster }}{{ $alert.Labels.cluster }}{{ else }}—{{ end }}`
          - **namespace** `{{ if $alert.Labels.namespace }}{{ $alert.Labels.namespace }}{{ else }}—{{ end }}`
          {{- with $alert.Labels.deployment }}
          - **déploiement** `{{ . }}`
          {{- end }}
          {{- with $alert.Labels.statefulset }}
          - **statefulset** `{{ . }}`
          {{- end }}
          {{- with $alert.Labels.job_name }}
          - **job** `{{ . }}`
          {{- end }}
          {{- with $alert.Labels.cronjob }}
          - **cronjob** `{{ . }}`
          {{- end }}
          - **sévérité** `{{ if $alert.Labels.severity }}{{ $alert.Labels.severity }}{{ else }}—{{ end }}`
          - **depuis** `{{ $alert.StartsAt | tz "America/Toronto" | date "02/01 15:04" }}` (Montréal){{ if eq $alert.Status "resolved" }} · **terminée** `{{ $alert.EndsAt | tz "America/Toronto" | date "02/01 15:04" }}`{{ end }}

          {{ template "k8s.links" $alert -}}
          {{- end -}}
          {{- end -}}

          {{ define "k8s.links" -}}
          {{ if .DashboardURL }}[Voir le dashboard]({{ .DashboardURL }}){{ else }}[Voir la règle]({{ .GeneratorURL }}){{ end }} · [Ignorer]({{ .SilenceURL }}){{ with .Annotations.runbook_url }} · [Runbook]({{ . }}){{ end }}{{ template "k8s.logs" . }}
          {{- end -}}

          {{ define "k8s.logs" -}}
          {{- $expr := "{" -}}
          {{- $sep := "" -}}
          {{- with .Labels.namespace }}{{ $expr = printf "%s%snamespace=%q" $expr $sep . }}{{ $sep = "," }}{{ end -}}
          {{- with .Labels.pod }}{{ $expr = printf "%s%spod=%q" $expr $sep . }}{{ $sep = "," }}{{ end -}}
          {{- with .Labels.container }}{{ $expr = printf "%s%scontainer=%q" $expr $sep . }}{{ $sep = "," }}{{ end -}}
          {{- $expr = printf "%s}" $expr -}}
          {{- if ne $expr "{}" -}}
          {{- $from := (.StartsAt.Add -3600000000000).UnixMilli -}}
          {{- $to := .StartsAt.UnixMilli -}}
          {{- if eq .Status "resolved" }}{{ $to = .EndsAt.UnixMilli }}{{ end -}}
          {{- $panes := printf "{\"p1\":{\"datasource\":\"P8E80F9AEF21F6940\",\"queries\":[{\"refId\":\"A\",\"expr\":%q,\"queryType\":\"range\"}],\"range\":{\"from\":%d,\"to\":%d}}}" $expr $from $to -}}
          {{ printf " · [Logs](https://grafana.etsmtl.club/explore?orgId=1&panes=%s)" (urlquery $panes) }}
          {{- end -}}
          {{- end -}}
