apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # Avant trivy-operator (sync-wave 1) : ses CRDs monitoring.coreos.com
    # doivent exister pour que le ServiceMonitor de Trivy soit accepté.
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: k8s-shared
  source:
    path: apps/prometheus
    repoURL: https://github.com/ClubCedille/k8s-shared.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRDs volumineuses (prometheuses, alertmanagers, ...) dépassent la
      # limite de 256 KiB de l'annotation last-applied-configuration en
      # client-side apply : le server-side apply est requis pour les installer.
      - ServerSideApply=true
