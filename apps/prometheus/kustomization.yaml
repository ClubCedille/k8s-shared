apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: prometheus
  namespace: monitoring
helmCharts:
  - name: kube-prometheus-stack
    version: "93.2.2"
    repo: "https://prometheus-community.github.io/helm-charts"
    releaseName: "prometheus"
    namespace: monitoring
    valuesFile: "helm/values.yaml"
    # Installe les CRDs monitoring.coreos.com (absentes du cluster). ArgoCD
    # applique les CRDs avant les CRs du même sync.
    includeCRDs: true
