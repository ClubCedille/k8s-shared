## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
##
 # -- Globals settings
global:
  ## As:
  ## imageRegistry: "docker.io"
  # -- Global image registry
  imageRegistry: ""
  ## As:
  imagePullSecrets:
    - ghcr-clubcedille-secret
# -- Namespace to install Matomo in, default matomo.
namespace: matomo
matomo:
  # -- Image registry to use.
  imageRegistry: ""
  ## As:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  # -- Image pull secrets for Matomo.
  imagePullSecrets: []
  # -- Which image to use for Matomo deployment.
  image: digitalist/matomo:5.14.1
  # -- run container as user id.
  runAsUser: 82
  # -- Install command. If already installed, it just creates the needed config.
  # LoginOIDC is not bundled in the digitalist image and /var/www/html is an
  # emptyDir that is re-synced on every pod start, so fetch the pinned plugin
  # during init instead of keeping its zip in this repo. The SHA-256 below is
  # for the unmodified upstream 5.0.0 marketplace zip; the perl one-liner then
  # drops the plugin's foreign key, which MariaDB 11 rejects because core and
  # plugin tables use different collations.
  #
  # OIDC policy: allowSignup=1 lets any Authentik user create a Matomo account
  # (with no site access by default); autoLinking=1 links an existing Matomo
  # user when their Authentik username matches their Matomo login. Set both to
  # 0 to require an administrator to create/link accounts instead.
  installCommand: >-
    curl -fsSL --retry 3 --retry-delay 2 -o /tmp/LoginOIDC.zip https://plugins.matomo.org/api/2.0/plugins/LoginOIDC/download/5.0.0 &&
    echo "36a87b7361547b8910a5a6f76cf434b07667ed8af0b266e38d45e107d541ab4f  /tmp/LoginOIDC.zip" | sha256sum -c - &&
    unzip -q -o /tmp/LoginOIDC.zip -d /var/www/html/plugins/ &&
    perl -0pi -e "s/,\s*\n\s*FOREIGN KEY.*?ON DELETE CASCADE//s" /var/www/html/plugins/LoginOIDC/LoginOIDC.php &&
    ./console plugin:activate ExtraTools &&
    ./console matomo:install --install-file=/tmp/matomo/install.json --force --do-not-drop-db &&
    ./console plugin:activate LoginOIDC &&
    ./console config:set "LoginOIDC.authenticationName=\"Authentik\"" "LoginOIDC.authorizeUrl=\"https://auth.etsmtl.club/application/o/authorize/\"" "LoginOIDC.tokenUrl=\"https://auth.etsmtl.club/application/o/token/\"" "LoginOIDC.userinfoUrl=\"https://auth.etsmtl.club/application/o/userinfo/\"" "LoginOIDC.userinfoId=\"preferred_username\"" "LoginOIDC.scope=\"openid email profile\"" "LoginOIDC.allowSignup=1" "LoginOIDC.autoLinking=1" "LoginOIDC.disablePasswordConfirmation=1" -q &&
    ./console config:set --section=LoginOIDC --key=clientId --value="$(cat /opt/matomo-oidc-secret/OIDC_CLIENT_ID)" -q &&
    ./console config:set --section=LoginOIDC --key=clientSecret --value="$(cat /opt/matomo-oidc-secret/OIDC_CLIENT_SECRET)" -q
  # Post install for helm chart. Starts a post-install-job.
  postInstallSleepTime: 5
  postInstallCommand: ""
  preUpgradeSleepTime: 5
  # Chart >= 12 runs core:update from the warmup init container. The chart's
  # pre-upgrade Job is still broken (it mounts configmaps that are not always
  # rendered), so leave it disabled and let the warmup handle the DB upgrade.
  preUpgradeCommand: ""
  extralabels: {}
  readinessProbe: {}
  livenessProbe: {}
  ## matomo:
  ##   env:
  ##     - name: BAR
  ##       value: foo
  ##     - name: FOO
  ##       valueFromSecret:
  ##         secretName: foo
  ##         key: bar
  # -- Env variables to inject, if any.
  env: []
  ## If you have a premium license for plugins, set it here.
  ## you need to create the secret before referring it.
  ## As:
  ## license:
  ##   secretKeyRef:
  ##     name: matomo-license
  ##     key: matomo-license
  license:
  ingress:
    enabled: false
    extralabels: {}
    annotations: {}
  cli:
    replicas: 1
    enabled: true
  cronJobs:
    coreArchive:
      enabled: true
      labels:
        name: matomo-jobs-corearchive
        instance: matomo
        component: cronjob
        partOf: matomo
        managedBy: helm
      schedule: "*/60 * * * *"
      concurrencyPolicy: Allow
      activeDeadlineSeconds: 43200
      command: ./console core:archive --disable-scheduled-tasks
    scheduledTasks:
      php:
      enabled: true
      labels:
        name: matomo-jobs-scheduled-tasks
        instance: matomo
        component: cronjob
        partOf: matomo
        managedBy: helm
      schedule: "*/60 * * * *"
      activeDeadlineSeconds: 43200
      command: ./console scheduled-tasks:run
  dashboard:
    sidecars: []
    ## added like this:
    # sidecars:
    # - name: fpm-metrics
    #   image: hipages/php-fpm_exporter:2.2.0
    #   imagePullPolicy: IfNotPresent
    #   resources:
    #     limits:
    #       cpu: 500m
    #       memory: 256Mi
    #     requests:
    #       cpu: 40m
    #       memory: 32Mi
    enabled: true
    replicas: 1
    loadbalancer: false
    hostname: matomo.etsmtl.club
    tls: false
    firstuser:
      username: admin
      password: admin123
      email: foo@example.com
    nginx:
      nginxWorkerProcesses: 5
      image: ''
      # conf:
      #   nginx.conf: |
      #     worker_processes 5;
      #     load_module modules/ngx_http_geoip2_module.so;
      #     ...
      #   fastcgi_params: |
      #     fastcgi_param   COUNTRY_CODE            $geoip2_data_country_code;
      #     fastcgi_param   QUERY_STRING            $query_string;
      #     fastcgi_param   REQUEST_METHOD          $request_method;
      #     ...
      #   mime.types: |
      #     types {
      #       text/html                                        html htm shtml;
      #       text/css                                         css;
      #       text/xml                                         xml;
      #       ...
      conf: ''
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "[ -f /tmp/nginx.pid ] && ps -A | grep nginx"
        initialDelaySeconds: 10
        periodSeconds: 5
      readinessProbe:
        httpGet:
          scheme: HTTP
          path: /index.php
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
    ingressClassName: ""
    ingress:
      annotations:
        digitalist.cloud/instance: "matomo"
  queuedTrackingMonitor:
    enabled: true
  queuedTrackingProcess:
    replicas: 1
  tracker:
    enabled: true
    replicas: 1
    hostname: matomo.etsmtl.club
    tls: false
    loadbalancer: false
    nginx:
      resources:
      nginxWorkerProcesses: 5
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "[ -f /tmp/nginx.pid ] && ps -A | grep nginx"
        initialDelaySeconds: 10
        periodSeconds: 5
      readinessProbe:
        httpGet:
          scheme: HTTP
          path: /matomo.js
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
    phpfpm:
      type: ondemand
      max_children: 75
      process_idle_timeout: 600s
      max_requests: 500
    ingressClassName: ""
    ingress:
      annotations:
        digitalist.cloud/instance: "matomo"
nginx:
  image: digitalist/nginx:1.31.6
  imagePullSecrets: []
  runAsUser: 100
db:
  hostname: matomo-mariadb
  password:
    secretKeyRef:
      name: matomo-db-secret
      key: password
  name: matomo
  username: root
  prefix: matomo_
# -- Extra secrets
