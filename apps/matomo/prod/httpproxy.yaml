apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: matomo
spec:
  virtualhost:
    fqdn: matomo.etsmtl.club
    tls:
      secretName: matomo-tls
      minimumProtocolVersion: "1.3"
  routes:
    # The dashboard nginx deliberately rejects matomo.php/piwik.php (403),
    # so tracking endpoints must be routed to the tracker deployment.
    - conditions:
        - exact: /matomo.php
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - exact: /piwik.php
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - exact: /matomo.js
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - exact: /piwik.js
      services:
        - name: matomo-tracker
          port: 8080
    # Static assets served by the tracker (heatmaps, overlay, UserFeedback).
    - conditions:
        - prefix: /js
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - prefix: /plugins/HeatmapSessionRecording
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - prefix: /plugins/Overlay/client
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - prefix: /plugins/UserFeedback/lib
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - prefix: /plugins/UserFeedback/css
      services:
        - name: matomo-tracker
          port: 8080
    - conditions:
        - prefix: /node_modules/jquery/dist
      services:
        - name: matomo-tracker
          port: 8080
    # Everything else (dashboard UI) goes to the dashboard.
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: matomo-dashboard
          port: 8080
      timeoutPolicy:
        idle: 600s
        response: 600s
