apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-allow-from-matomo
spec:
  podSelector:
    matchLabels:
      app: matomo-mariadb
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matomo
      ports:
        - protocol: TCP
          port: 3306