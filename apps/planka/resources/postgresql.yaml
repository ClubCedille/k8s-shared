apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-planka
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: planka
      owner: planka
      secret:
        name: planka-cnpg-auth
  storage:
    size: 15Gi
    storageClass: cephfs
  postgresql:
    parameters:
      wal_compression: "on"
      wal_keep_size: "1GB"
      max_slot_wal_keep_size: "2GB"
