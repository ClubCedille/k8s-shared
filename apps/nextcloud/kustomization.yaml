---
namespace: nextcloud
resources:
  - resources/postgresql.yaml
  - resources/httpproxy.yaml
  - resources/certificate.yaml
  - resources/pvc.yaml
  - resources/cronjob.yaml
  - resources/vault.yaml
  - resources/nextcloud-setup-job.yaml

patches:
  - target:
      kind: Deployment
      name: nextcloud
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nextcloud
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/backup: velero
            annotations:
              backup.velero.io/backup-volumes: nextcloud-main
  # kube-score: use distinct handlers for readiness/liveness.
  - target:
      kind: Deployment
      name: nextcloud
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /
  - target:
      kind: Deployment
      name: collabora-collabora-online
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 9980
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
          successThreshold: 1
  - target:
      kind: Deployment
      name: nextcloud-metrics
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /metrics
            port: 9205
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 9205
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm
    version: 9.1.3
    releaseName: nextcloud
    namespace: nextcloud
    valuesFile: ./helm/nextcloud-values.yaml
  - name: collabora-online
    repo: https://collaboraonline.github.io/online
    version: 1.3.0
    releaseName: collabora
    namespace: nextcloud
    valuesFile: ./helm/collabora-values.yaml

configMapGenerator:
  - name: nextcloud-setup-job
    files:
      - ../../data/nextcloud-external-sites.yaml
      - ../../data/clubs.yaml
      - ./resources/nextcloud-setup.bash

generatorOptions:
  disableNameSuffixHash: true
