---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-tls
spec:
  secretName: nextcloud-ingress-tls
  issuerRef:
    name: letsencrypt-etsmtl
    kind: ClusterIssuer
  commonName: old-nextcloud.etsmtl.club
  dnsNames: [old-nextcloud.etsmtl.club]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: collabora-tls
spec:
  secretName: collabora-ingress-tls
  issuerRef:
    name: letsencrypt-etsmtl
    kind: ClusterIssuer
  commonName: old-collabora-nextcloud.etsmtl.club
  dnsNames: [old-collabora-nextcloud.etsmtl.club]
