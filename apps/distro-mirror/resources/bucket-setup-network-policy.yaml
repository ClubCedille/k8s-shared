# The setup Job only makes outbound S3 API calls to the internal RGW
# endpoint and exits -- no ingress, broad egress is fine here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distro-mirror-bucket-setup
spec:
  podSelector:
    matchLabels:
      app: distro-mirror-bucket-setup
  policyTypes:
    - Egress
  egress:
    - {}
