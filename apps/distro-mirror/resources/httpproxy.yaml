apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: distro-mirror
spec:
  virtualhost:
    fqdn: mirror.etsmtl.club
    tls:
      secretName: distro-mirror-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: distro-mirror-frontend
          port: 80
