apiVersion: apps/v1
kind: Deployment
metadata:
  name: distro-mirror-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distro-mirror-frontend
  template:
    metadata:
      labels:
        app: distro-mirror-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: distro-mirror
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: template
          configMap:
            name: distro-mirror-frontend
