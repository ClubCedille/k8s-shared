# Mounted at /etc/nginx/templates/default.conf.template — the official nginx
# image's entrypoint runs envsubst on it at startup (only ${VAR}-braced names
# are substituted, so nginx's own unbraced $uri/$host variables are untouched)
# and writes the result to /etc/nginx/conf.d/default.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: distro-mirror-frontend
data:
  default.conf.template: |
    server {
      listen 8080;

      # /healthz (readiness) and /livez (liveness) are separate paths on
      # purpose -- reusing one probe for both would tie "remove from
      # service" and "restart the container" to the exact same signal.
      location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location = /livez {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location / {
        # nginx can't compose a proxy_pass URI with a rewritten $uri (the
        # "part to replace cannot be determined" case per the nginx docs),
        # so the bucket prefix is folded into the rewrite instead and
        # proxy_pass is given no URI of its own.
        # RGW has no directory concept: map a trailing-slash request to the
        # index.html generated by the sync CronJobs at that prefix.
        rewrite ^(.*)/$ $1/index.html;
        rewrite ^/(.*)$ /${BUCKET_NAME}/$1 break;
        proxy_pass http://10.0.21.59:7480;
        proxy_set_header Host 10.0.21.59;
        proxy_intercept_errors on;
      }
    }
