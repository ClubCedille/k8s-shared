# Pilot sync job (issue: Mirror: pilote distro-mirror Ubuntu end-to-end).
# Scope is intentionally narrow (current + previous LTS, amd64 server ISO +
# cloud image) to validate the two-step rsync -> rclone pattern end-to-end.
# Full supported-release curation happens when this pattern is replicated to
# the other distros.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-ubuntu
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: fetch-isos
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache rsync
                  mkdir -p /scratch/ubuntu/amd64/isos
                  for rel in 22.04 24.04; do
                    # -L dereferences symlinks: release ISOs are published as
                    # symlinks to the latest point release, not regular files.
                    rsync -rLt \
                      --include="*live-server*amd64.iso" \
                      --exclude="*" \
                      "rsync://rsync.releases.ubuntu.com/releases/${rel}/" /scratch/ubuntu/amd64/isos/
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
            - name: fetch-cloud-images
              image: alpine:3.20
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl
                  mkdir -p /scratch/ubuntu/amd64/cloud-images
                  for rel in jammy noble; do
                    curl -fsSL -o "/scratch/ubuntu/amd64/cloud-images/${rel}-server-cloudimg-amd64.img" \
                      "https://cloud-images.ubuntu.com/${rel}/current/${rel}-server-cloudimg-amd64.img"
                  done
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          containers:
            - name: push-to-bucket
              image: rclone/rclone:1.68.2
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  export RCLONE_CONFIG_S3_TYPE=s3
                  export RCLONE_CONFIG_S3_PROVIDER=Ceph
                  export RCLONE_CONFIG_S3_ENV_AUTH=false
                  export RCLONE_CONFIG_S3_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
                  export RCLONE_CONFIG_S3_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
                  export RCLONE_CONFIG_S3_ENDPOINT="http://${BUCKET_HOST}:${BUCKET_PORT}"
                  # --s3-no-check-bucket: the OBC-scoped user can write to its
                  # bucket but not head/create buckets, which is what rclone
                  # tries by default before the first upload.
                  rclone copy /scratch/ubuntu "s3:${BUCKET_NAME}/ubuntu" --transfers=4 --checkers=8 --s3-no-check-bucket
                  {
                    echo "<html><body><h1>ubuntu/amd64</h1><ul>"
                    rclone lsf "s3:${BUCKET_NAME}/ubuntu/amd64" -R --files-only --s3-no-check-bucket \
                      | sed 's#.*#<li><a href="/ubuntu/amd64/&">&</a></li>#'
                    echo "</ul></body></html>"
                  } > /tmp/index.html
                  rclone copyto /tmp/index.html "s3:${BUCKET_NAME}/ubuntu/amd64/index.html" --s3-no-check-bucket
              envFrom:
                - configMapRef:
                    name: distro-mirror
                - secretRef:
                    name: distro-mirror
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 10Gi
