apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matrix
resources:
  - resources/certificate.yaml
  - resources/cinny-configmap.yaml
  - resources/cinny-deployment.yaml
  - resources/cinny-service.yaml
  - resources/httpproxy.yaml
  - resources/pvc.yaml
helmCharts:
  - name: matrix-synapse
    repo: https://ananace.gitlab.io/charts
    version: 3.12.41
    releaseName: matrix-stack
    namespace: matrix
    valuesFile: matrix-stack/values.yaml
    includeCRDs: true
