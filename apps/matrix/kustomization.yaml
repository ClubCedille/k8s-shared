apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: netbox-v1
  namespace: netbox
resources:
  - resources/certificate.yaml
  - resources/httpproxy.yaml
  - resources/pvc.yaml
helmCharts:
  - name: matrix-synapse
    repo: https://ananace.gitlab.io/charts
    version: 3.10.14
    releaseName: matrix-stack
    namespace: matrix
    valuesFile: matrix-stack/values.yaml
    includeCRDs: true
