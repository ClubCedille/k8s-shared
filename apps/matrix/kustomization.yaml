apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matrix
resources:
  - resources/certificate.yaml
  # Client web Cinny
  - resources/cinny/cinny-configmap.yaml
  - resources/cinny/cinny-deployment.yaml
  - resources/cinny/cinny-service.yaml
  - resources/httpproxy.yaml
  # MatrixRTC (LiveKit SFU + lk-jwt-service)
  - resources/livekit-rtc/livekit-configmap.yaml
  - resources/livekit-rtc/livekit-deployment.yaml
  - resources/livekit-rtc/livekit-media-service.yaml
  - resources/livekit-rtc/livekit-service.yaml
  - resources/livekit-rtc/lk-jwt-deployment.yaml
  - resources/livekit-rtc/lk-jwt-service.yaml
  - resources/livekit-rtc/matrix-rtc-certificate.yaml
  - resources/livekit-rtc/matrix-rtc-httpproxy.yaml
  - resources/livekit-rtc/matrix-rtc-networkpolicy.yaml
  - resources/pvc.yaml
  - resources/turn-certificate.yaml
  # Bridge mautrix-discord
  - resources/mautrix/mautrix-discord-configmap.yaml
  - resources/mautrix/mautrix-discord-deployment.yaml
  - resources/mautrix/mautrix-service.yaml
  # Synapse Admin
  - resources/synapse-admin/synapse-admin-certificate.yaml
  - resources/synapse-admin/synapse-admin-configmap.yaml
  - resources/synapse-admin/synapse-admin-deployment.yaml
  - resources/synapse-admin/synapse-admin-httpproxy.yaml
  - resources/synapse-admin/synapse-admin-services.yaml
  # Matrix Hookshot
  - resources/hookshot/matrix-hookshot-certificate.yaml
  - resources/hookshot/matrix-hookshot-configmap.yaml
  - resources/hookshot/matrix-hookshot-deployment.yaml
  - resources/hookshot/matrix-hookshot-httpproxy.yaml
  - resources/hookshot/matrix-hookshot-service.yaml
helmCharts:
  - name: matrix-synapse
    repo: https://ananace.gitlab.io/charts
    version: 3.12.43
    releaseName: matrix-stack
    namespace: matrix
    valuesFile: matrix-stack/values.yaml
    includeCRDs: true
