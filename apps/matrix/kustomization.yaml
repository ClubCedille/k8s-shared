apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matrix
resources:
  - resources/certificate.yaml
  - resources/cinny-configmap.yaml
  - resources/cinny-deployment.yaml
  - resources/cinny-service.yaml
  - resources/cinny-legacy-configmap.yaml
  - resources/coturn-configmap.yaml
  - resources/coturn-deployment.yaml
  - resources/httpproxy.yaml
  - resources/livekit-configmap.yaml
  - resources/livekit-deployment.yaml
  - resources/livekit-media-service.yaml
  - resources/livekit-service.yaml
  - resources/lk-jwt-deployment.yaml
  - resources/lk-jwt-service.yaml
  - resources/matrix-rtc-certificate.yaml
  - resources/matrix-rtc-httpproxy.yaml
  - resources/manual-secrets.yaml
  - resources/matrix-rtc-networkpolicy.yaml
  - resources/mautrix-discord-configmap.yaml
  - resources/mautrix-discord-deployment.yaml
  - resources/mautrix-discord-pvc.yaml
  - resources/mautrix-discord-service.yaml
  - resources/pvc.yaml
