apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  namespace: matrix
  annotations:
    # external-dns (source=service) crée le A record turn.etsmtl.club -> .77
    external-dns.alpha.kubernetes.io/hostname: turn.etsmtl.club
spec:
  type: LoadBalancer
  loadBalancerIP: 142.137.247.77
  externalTrafficPolicy: Local
  selector:
    app: livekit
  ports:
    - name: turn-tls
      port: 5349
      targetPort: 5349
      protocol: TCP
    - name: ice-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
    # Média WebRTC (UDP). Une entrée par port : Kubernetes ne sait pas
    # exposer une plage UDP dans un Service.
