apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-hookshot
  namespace: matrix
  labels:
    app: matrix-hookshot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matrix-hookshot
  template:
    metadata:
      labels:
        app: matrix-hookshot
    spec:
      containers:
        - name: matrix-hookshot
          image: halfshot/matrix-hookshot:latest
          ports:
            - containerPort: 9993
              name: appservice
            - containerPort: 9000
              name: webhooks
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /data/config.yml
              subPath: config.yml
              readOnly: true
            - name: secrets
              mountPath: /data/registration.yml
              subPath: registration.yaml
              readOnly: true
            - name: secrets
              mountPath: /data/passkey.pem
              subPath: passkey.pem
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-hookshot-config
        - name: secrets
          secret:
            secretName: matrix-hookshot-secret
