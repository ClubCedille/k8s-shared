# Secrets créés à la main dans le namespace matrix. Leurs valeurs ne sont PAS
# versionnées : matrix.argoapp.yml ignore /data et /stringData pour ces noms,
# donc ArgoCD ne les écrase pas (voir README.md).
apiVersion: v1
kind: Secret
metadata:
  name: authentik-credentials
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-oidc-secret
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: coturn-secret
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: matrix-rtc-secrets
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: mautrix-discord-secret
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: synapse-authentik-config
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: synapse-authentik-secret
  namespace: matrix
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: synapse-manual-secrets
  namespace: matrix
type: Opaque
