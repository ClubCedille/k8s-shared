apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: matrix
data:
  livekit.yaml: |
    port: 7880
    log_level: info

    rtc:
      tcp_port: 7881
      # La plage UDP est exposée via le Service LoadBalancer sur 142.137.247.77.
      port_range_start: 50000
      port_range_end: 50009
      # Les nodes ont des IP privées : on annonce explicitement le VIP public.
      use_external_ip: false
      node_ip: 142.137.247.77

    room:
      # Seul lk-jwt-service peut créer une room (évite l'abus du SFU).
      auto_create: false

    redis:
      address: matrix-stack-redis-master:6379
      db: 3
      password: "@@REDIS_PASSWORD@@"

    keys:
      "@@LIVEKIT_KEY@@": "@@LIVEKIT_SECRET@@"

    # TURN intégré : pas de coturn à déployer. Hostname dédié car
    # matrix-rtc.etsmtl.club pointe sur le VIP Contour (.75), pas sur le SFU.
    turn:
      enabled: true
      domain: turn.etsmtl.club
      tls_port: 5349
      udp_port: 50010
      relay_range_start: 50011
      relay_range_end: 50019
      cert_file: /etc/livekit/turn-tls/tls.crt
      key_file: /etc/livekit/turn-tls/tls.key

    webhook:
      api_key: "@@LIVEKIT_KEY@@"
      urls:
        - https://matrix-rtc.etsmtl.club/livekit/jwt/sfu_webhook

    prometheus_port: 6789
