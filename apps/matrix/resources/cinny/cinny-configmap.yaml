apiVersion: v1
kind: ConfigMap
metadata:
  name: cinny-config
  namespace: matrix
data:
  config.json: |
    {
      "defaultHomeserver": 0,
      "homeserverList": [
        "matrix.etsmtl.club"
      ]
    }
  default.conf: |
    server {
      listen 80;
      listen [::]:80;

      location / {
        root /usr/share/nginx/html;

        sub_filter '</head>' '<script>(function(){try{var s=JSON.parse(localStorage.getItem("settings")||"{}");if(!("hideMembershipEvents" in s)){s.hideMembershipEvents=true;localStorage.setItem("settings",JSON.stringify(s));}}catch(e){}})();</script></head>';
        sub_filter_once on;

        rewrite ^/config.json$ /config.json break;
        rewrite ^/manifest.json$ /manifest.json break;

        rewrite ^/sw.js$ /sw.js break;
        rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

        rewrite ^/public/(.*)$ /public/$1 break;
        rewrite ^/assets/(.*)$ /assets/$1 break;

        rewrite ^(.+)$ /index.html break;
      }
    }
