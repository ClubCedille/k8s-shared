# Deux policies minimales pour satisfaire le gate kube-score et documenter
# les flux MatrixRTC. Note : le pod LiveKit est en hostNetwork, donc les
# NetworkPolicy ne filtrent pas son trafic réel (le kernel du node reste la
# frontière) ; celle-ci sert surtout de contrat/visibilité.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: livekit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lk-jwt-service
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: lk-jwt-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
