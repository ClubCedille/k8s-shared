apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: matrix-rtc-proxy
  namespace: matrix
spec:
  virtualhost:
    fqdn: matrix-rtc.etsmtl.club
    tls:
      secretName: matrix-rtc-tls
  routes:
    # MatrixRTC Authorization Service (lk-jwt-service).
    # Les clients appellent /livekit/jwt/<endpoint>; on retire le préfixe
    # avant de transmettre au service qui écoute sur /<endpoint>.
    - conditions:
        - prefix: /livekit/jwt/
      pathRewritePolicy:
        replacePrefix:
          - prefix: /livekit/jwt/
            replacement: /
      services:
        - name: lk-jwt-service
          port: 8080
      timeoutPolicy:
        response: 120s
        idle: 120s

    # Signalisation LiveKit (WebSocket) : le SDK et lk-jwt-service se
    # connectent a wss://matrix-rtc.etsmtl.club/livekit/sfu. On retire le
    # prefixe avant de transmettre a LiveKit, qui ecoute sur "/".
    - conditions:
        - prefix: /livekit/sfu
      pathRewritePolicy:
        replacePrefix:
          - prefix: /livekit/sfu
            replacement: /
      enableWebsockets: true
      services:
        - name: livekit
          port: 7880
      timeoutPolicy:
        response: 600s
        idle: 600s

    # Catch-all (média WebRTC : voir livekit-media-service.yaml).
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: livekit
          port: 7880
      timeoutPolicy:
        response: 600s
        idle: 600s
