apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: matrix
data:
  livekit.yaml: |
    port: 7880
    log_level: info

    rtc:
      tcp_port: 7881
      # UDP mux : tout le média passe par un seul port. (Ne pas définir
      # port_range_start/end en même temps.) Passer à une plage courte
      # ex. 50000-50007 si besoin de plus de débit.
      udp_port: 50000
      # Les nodes ont des IP privées : on annonce explicitement le VIP public.
      use_external_ip: false
      node_ip: 142.137.247.72

    room:
      # Seul lk-jwt-service peut créer une room (évite l'abus du SFU).
      auto_create: false

    redis:
      address: matrix-stack-redis-master:6379
      db: 3
      password: "@@REDIS_PASSWORD@@"

    keys:
      "@@LIVEKIT_KEY@@": "@@LIVEKIT_SECRET@@"

    # TURN intégré : pas de coturn à déployer. Hostname dédié car
    # matrix-rtc.etsmtl.club pointe sur le VIP Contour (.75), pas sur le SFU.
    turn:
      enabled: true
      domain: turn.etsmtl.club
      # 443 autorisé par le firewall Université (5349 bloqué).
      tls_port: 443
      udp_port: 50001
      relay_range_start: 50002
      relay_range_end: 50005
      cert_file: /etc/livekit/turn-tls/tls.crt
      key_file: /etc/livekit/turn-tls/tls.key

    webhook:
      api_key: "@@LIVEKIT_KEY@@"
      urls:
        - https://matrix-rtc.etsmtl.club/livekit/jwt/sfu_webhook

    prometheus_port: 6789
