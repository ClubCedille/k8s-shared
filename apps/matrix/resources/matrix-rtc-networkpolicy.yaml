# Policies minimales pour satisfaire le gate kube-score et documenter les
# flux du namespace. Le média LiveKit passe par un Service LoadBalancer ;
# ces policies servent surtout de contrat/visibilité.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: livekit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
---
