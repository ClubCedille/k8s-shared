apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautrix-discord
  namespace: matrix
  labels:
    app: mautrix-discord
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mautrix-discord
  template:
    metadata:
      labels:
        app: mautrix-discord
    spec:
      initContainers:
        - name: render-config
          image: busybox:1.36
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          command:
            - sh
            - -c
            - |
              sed -e "s|@@AS_TOKEN@@|${AS_TOKEN}|g" \
                  -e "s|@@HS_TOKEN@@|${HS_TOKEN}|g" \
                  /config/config.yaml > /data/config.yaml
          env:
            - name: AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mautrix-discord-secret
                  key: as-token
            - name: HS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mautrix-discord-secret
                  key: hs-token
          volumeMounts:
            - name: config-template
              mountPath: /config
            - name: data
              mountPath: /data
      containers:
        - name: mautrix-discord
          image: dock.mau.dev/mautrix/discord:v0.7.1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: appservice
              containerPort: 29334
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: appservice
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config-template
          configMap:
            name: mautrix-discord-config
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-discord-pvc
