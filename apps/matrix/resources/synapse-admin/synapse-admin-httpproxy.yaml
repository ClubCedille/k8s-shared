apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: synapse-admin-proxy
  namespace: matrix
spec:
  virtualhost:
    fqdn: synapse-admin.etsmtl.club
    tls:
      secretName: synapse-admin-tls
  routes:
    - conditions:
        - prefix: /
      services:
        - name: synapse-admin-deployment
          port: 80
      timeoutPolicy:
        response: 60s
        idle: 60s
