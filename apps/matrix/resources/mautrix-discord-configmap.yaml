apiVersion: v1
kind: ConfigMap
metadata:
  name: mautrix-discord-config
  namespace: matrix
data:
  config.yaml: |
    homeserver:
      address: http://matrix-stack-matrix-synapse:8008
      domain: matrix.etsmtl.club

    appservice:
      address: http://mautrix-discord.matrix.svc.cluster.local:29334
      hostname: 0.0.0.0
      port: 29334
      id: discord
      bot:
        username: discordbot
        displayname: Discord Bridge Bot
      as_token: "@@AS_TOKEN@@"
      hs_token: "@@HS_TOKEN@@"
      database:
        type: sqlite3-fk-wal
        uri: file:/data/mautrix-discord.db?_txlock=immediate

    bridge:
      public_address: https://matrix.etsmtl.club
      avatar_proxy_key: generate
      permissions:
        "*": relay
        "matrix.etsmtl.club": user
        # "@tonuser:matrix.etsmtl.club": admin

    logging:
      min_level: info
      writers:
        - type: stdout
          format: pretty-colored
