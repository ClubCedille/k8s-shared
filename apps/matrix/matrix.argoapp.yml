apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix
  namespace: argocd
spec:
  destination:
    namespace: matrix
    server: https://kubernetes.default.svc
  project: k8s-shared
  source:
    path: apps/matrix
    repoURL: https://github.com/ClubCedille/k8s-shared.git
    targetRevision: HEAD
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: matrix-stack-postgresql
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: matrix-stack-redis
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: matrix-stack-matrix-synapse
      jsonPointers:
        - /data
        - /stringData
    - group: apps
      kind: Deployment
      name: matrix-stack-matrix-synapse
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secrets
    # Secrets adoptés mais créés à la main : ne jamais écraser leurs données.
    - group: ""
      kind: Secret
      name: authentik-credentials
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: authentik-oidc-secret
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: coturn-secret
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: matrix-rtc-secrets
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: mautrix-discord-secret
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: synapse-authentik-config
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: synapse-authentik-secret
      jsonPointers: [/data, /stringData]
    - group: ""
      kind: Secret
      name: synapse-manual-secrets
      jsonPointers: [/data, /stringData]
  syncPolicy:
    automated:
      # ArgoCD v3 exige enabled: true (sinon l'auto-sync reste désactivé).
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
