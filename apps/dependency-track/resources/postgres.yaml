# PostgreSQL externe (CloudNativePG) -- issue #606 : "Base de donnees :
# PostgreSQL (la base embarquee n'est pas adaptee a la production)".
# Le secret `dependency-track-db-secret` est cree par VaultStaticSecret
# (voir vault.yaml) avant le bootstrap du cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-dependency-track
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: dtrack
      owner: dtrack
      secret:
        name: dependency-track-db-secret
  storage:
    size: 20Gi
    storageClass: ceph-rbd
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-dependency-track-b2
---
# Sauvegardes : "Mettre en place les sauvegardes de la base et tester une
# restauration" (issue #606). Quotidiennes a 06h20, retention 30j sur B2.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-dependency-track-backup
spec:
  schedule: "0 20 6 * * *"
  backupOwnerReference: self
  cluster:
    name: postgresql-dependency-track
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-dependency-track-b2
spec:
  configuration:
    destinationPath: s3://k8s-shared-bucket/postgresql-dependency-track
    endpointURL: https://s3.ca-east-006.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: b2-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: b2-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
