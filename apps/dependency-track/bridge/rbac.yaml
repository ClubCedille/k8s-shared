---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbom-bridge
---
# Lecture des SbomReport dans tous les namespaces (les rapports sont
# namespace-scopes, mais l'inventaire doit couvrir tous les workloads).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-track-sbom-bridge
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["sbomreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-track-sbom-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-track-sbom-bridge
subjects:
  - kind: ServiceAccount
    name: sbom-bridge
    namespace: dependency-track
---
# Etat incremental : seul le namespace dependency-track est concerne.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dependency-track-sbom-bridge
  namespace: dependency-track
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sbom-bridge-state"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dependency-track-sbom-bridge
  namespace: dependency-track
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dependency-track-sbom-bridge
subjects:
  - kind: ServiceAccount
    name: sbom-bridge
    namespace: dependency-track
