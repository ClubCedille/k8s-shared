apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: formulemaster-tls
  namespace: authentik
spec:
  secretName: formulemaster-tls
  issuerRef:
    name: letsencrypt-etsmtl
    kind: ClusterIssuer
  dnsNames:
    - formule.canoe.etsmtl.club
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: formulemaster
  namespace: authentik
spec:
  virtualhost:
    fqdn: formule.canoe.etsmtl.club
    tls:
      secretName: formulemaster-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      requestHeadersPolicy:
        set:
          - name: X-Forwarded-Host
            value: "%REQ(:authority)%"
          - name: X-Forwarded-Proto
            value: "%REQ(:scheme)%"
        remove:
          - X-authentik-uid
          - X-authentik-name
          - X-authentik-email
          - X-authentik-username
          - X-authentik-groups
      services:
        - name: authentik-server
          port: 80
