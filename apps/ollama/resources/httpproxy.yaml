apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: ollama
spec:
  virtualhost:
    fqdn: ollama.etsmtl.club
    tls:
      secretName: ollama-tls
      minimumProtocolVersion: "1.3"

  routes:
    - conditions:
        - prefix: /
      # Inférence lente (modèle partiellement sur CPU)
      timeoutPolicy:
        response: 300s
      services:
        - name: ollama-auth-proxy
          port: 8080
