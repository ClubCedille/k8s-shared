apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  virtualhost:
    fqdn: sonarqube.etsmtl.club
    tls:
      secretName: sonarqube-tls-secret
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: sonarqube-sonarqube
          port: 9000
