apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
spec:
  destination:
    namespace: netbox
    server: https://kubernetes.default.svc
  project: k8s-shared
  source:
    path: apps/netbox
    repoURL: https://github.com/ClubCedille/k8s-shared.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Le chart netbox (et le sous-chart valkey qu'il embarque) génère ces
  # secrets avec une valeur aléatoire à chaque rendu (randAscii/randAlphaNumeric,
  # sans lookup Helm fonctionnel côté ArgoCD) -- sans ce ignoreDifferences,
  # selfHeal republie une nouvelle valeur à chaque reconciliation sans jamais
  # redémarrer les pods netbox/netbox-worker, qui gardent l'ancienne en
  # mémoire (Django ne relit pas le fichier monté) -> AuthenticationError
  # aléatoire en prod. Cause racine identifiée pour netbox-valkey :
  # apps/netbox/helm/values.yaml utilise les mauvaises clés
  # (existingSecretName/existingSecretKey au lieu de
  # existingSecret/existingSecretPasswordKey attendues par le chart
  # bitnami/valkey), à corriger séparément une fois un secret valkey-password
  # correctement provisionné.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: django-secret
      namespace: netbox
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: netbox-superuser
      namespace: netbox
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: netbox-valkey
      namespace: netbox
      jsonPointers:
        - /data
