# Setting Django
existingSecret: "django-secret"
allowedHosts:
  - "netbox.etsmtl.club"

# Email settings
email:
  server: localhost
  port: 25
  username: "bacon143"
  password: ""
  useSSL: false
  useTLS: false
  sslCertFile: ""
  sslKeyFile: ""
  # Timeout in seconds
  timeout: 10
  from: ""
  existingSecretName: ""
  existingSecretKey: ""


ingress:
  enabled: false

# DB Django (with CNPG)
postgresql:
  enabled: false

externalDatabase:
  host: "netbox-db-rw.netbox.svc.cluster.local"
  port: 5432
  database: "netbox"
  username: "netbox"
  existingSecretName: "netbox-db-app"
  existingSecretKey: "password"
  engine: django.db.backends.postgresql
  connMaxAge: 300
  disableServerSideCursors: false
  options:
    sslmode: "prefer"
    target_session_attrs: "read-write"


valkey:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: valkey-secret
    existingSecretPasswordKey: valkey-password

persistence:
  enabled: true
  # ReadWriteOnce provoque un deadlock au redémarrage : le pod web et
  # netbox-worker peuvent être schedulés sur des nœuds différents, et le
  # volume RWO ne peut être attaché qu'à un seul nœud à la fois (le
  # StorageClass cephfs supporte nativement RWX).
  accessMode: ReadWriteMany
  size: 5Gi

# SSO Gestion
remoteAuth:
  enabled: true
  backends:
    - "social_core.backends.open_id_connect.OpenIdConnectAuth"
  autoCreateUser: true
extraVolumes:
  - name: sso-secret-volume
    secret:
      secretName: sso-secret
  - name: token-peppers-volume
    secret:
      secretName: netbox-token-peppers

extraVolumeMounts:
  - name: sso-secret-volume
    mountPath: /etc/netbox/config/sso.py
    subPath: sso.py
    readOnly: true
  - name: token-peppers-volume
    mountPath: /etc/netbox/config/token-peppers.py
    subPath: token-peppers.py
    readOnly: true

livenessProbe:
  enabled: true
  path: "/"
  initialDelaySeconds: 360
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

worker:
  livenessProbe:
    initialDelaySeconds: 60


config:
  debug: false