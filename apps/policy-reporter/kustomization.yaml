apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: policy-reporter
resources:
  - resources/certificate.yaml
  - resources/httpproxy.yaml
  - resources/vault.yaml
helmCharts:
  - name: policy-reporter
    repo: https://kyverno.github.io/policy-reporter
    version: 3.11.2
    releaseName: policy-reporter
    namespace: policy-reporter
    valuesFile: ./helm/policy-reporter-values.yaml
  - name: trivy-operator-polr-adapter
    repo: https://fjogeleit.github.io/trivy-operator-polr-adapter
    version: 0.11.5
    releaseName: trivy-operator-polr-adapter
    namespace: policy-reporter
    valuesFile: ./helm/polr-adapter-values.yaml
