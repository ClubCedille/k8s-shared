apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: freebsd-cache
spec:
  virtualhost:
    fqdn: freebsd-cache.pkg.etsmtl.club
    tls:
      secretName: freebsd-cache-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      timeoutPolicy:
        response: 4h
        idle: 4h
      services:
        - name: freebsd-pkg-cache
          port: 8080
