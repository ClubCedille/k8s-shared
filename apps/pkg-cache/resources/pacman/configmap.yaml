apiVersion: v1
kind: ConfigMap
metadata:
  name: pacman-cache-config
data:
  pacoloco.yaml: |
    port: 9129
    cache_dir: /var/cache/pacoloco
    purge_files_after: 7776000 # 90 days
    download_timeout: 3600
    repos:
      archlinux:
        url: https://geo.mirror.pkgbuild.com
---
# nginx sidecar: pacoloco itself has no BasicAuth of its own, same reason
# apt-cacher-ng needed one (see deployment.yaml comment there).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pacman-cache-nginx
data:
  default.conf: |
    server {
      listen 8080;

      location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location = /livez {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location / {
        auth_basic "pacman-cache";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        proxy_pass http://127.0.0.1:9129;
        proxy_set_header Host $host;

        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
      }
    }
