# Dedicated sub-domain with BasicAuth (nginx auth_basic, same as apt-cache
# and every other flavor here -- decided against mTLS across the board).
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: dnf-cache
spec:
  virtualhost:
    fqdn: dnf-cache.pkg.etsmtl.club
    tls:
      secretName: dnf-cache-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      timeoutPolicy:
        response: 4h
        idle: 4h
      services:
        - name: dnf-cache
          port: 8080
