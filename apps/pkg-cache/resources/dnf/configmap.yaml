# nginx proxy_cache in front of Fedora's own direct download infra
# (dl.fedoraproject.org -- no mirrormanager redirect chain, unlike
# download.fedoraproject.org). Contour strips the /fedora prefix before
# this receives the request (see mtls-httpproxy.yaml), so paths here
# match dl.fedoraproject.org's own layout directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnf-cache-nginx
data:
  default.conf: |
    proxy_cache_path /var/cache/nginx/dnf levels=1:2 keys_zone=dnf:10m max_size=15g inactive=90d use_temp_path=off;

    server {
      listen 8080;

      location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location = /livez {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location / {
        auth_basic "dnf-cache";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        proxy_cache dnf;
        proxy_cache_valid 200 90d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_ssl_server_name on;
        proxy_set_header Host dl.fedoraproject.org;
        proxy_pass https://dl.fedoraproject.org;

        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
      }
    }
