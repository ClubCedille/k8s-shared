---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: nextcloud-new-auth
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    audiences:
      - vault
    role: secret-reader
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: b2-creds
spec:
  vaultAuthRef: nextcloud-new-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/b2-creds
  destination:
    name: b2-creds
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-garage-credentials
spec:
  vaultAuthRef: nextcloud-new-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/nextcloud_s3
  destination:
    name: nextcloud-garage-credentials
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-admin
spec:
  vaultAuthRef: nextcloud-new-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/nextcloud-new-admin
  destination:
    name: nextcloud-admin
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: redis-secret
spec:
  vaultAuthRef: nextcloud-new-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/nextcloud-new-redis
  destination:
    name: redis-secret
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dockerhub-pull-secret
spec:
  vaultAuthRef: nextcloud-new-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/docker
  destination:
    name: dockerhub-pull
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: collabora-admin
spec:
  vaultAuthRef: nextcloud-new-auth
  type: kv-v1
  mount: kv-system
  path: default_passwords/nextcloud-new-collabora
  destination:
    name: collabora-admin
    create: true
