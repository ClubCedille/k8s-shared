---
# Config/apps volume only — user file data lives in Garage (S3 primary storage, see
# nextcloud-values.yaml OBJECTSTORE_S3_* env vars). Still needs RWX: shared across
# replicaCount: 3 pods for config.php/apps consistency.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      # Aligné sur le PVC réel du cluster (30Ti, créé ainsi lors de la mise en
      # place de l'instance parallèle). Kubernetes interdit de réduire un PVC :
      # garder 20Gi ici faisait échouer chaque sync ArgoCD sur ce patch.
      # Les fichiers utilisateurs sont dans Garage (S3), pas dans ce volume.
      storage: 30Ti
  storageClassName: cephfs
