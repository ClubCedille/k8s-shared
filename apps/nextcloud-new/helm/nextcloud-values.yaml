---
## Official nextcloud image version
## ref: https://hub.docker.com/r/library/nextcloud/tags/
##
image:
  registry: docker.io
  repository: library/nextcloud
  flavor: apache
  # default is generated by flavor and appVersion
  pullPolicy: Always
  pullSecrets:
    - dockerhub-pull
# Number of replicas to be deployed
replicaCount: 3
## Allowing use of ingress controllers
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  enabled: false
  # className: nginx
  annotations:
    kubernetes.io/tls-acme: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: nextcloud-tls
      hosts: [new-nextcloud.etsmtl.club]
  labels: {}
  path: /
  pathType: Prefix
phpClientHttpsFix:
  enabled: true
  protocol: https
nextcloud:
  host: new-nextcloud.etsmtl.club
  ## Use an existing secret
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
    tokenKey: 'metrics-token'
    smtpUsernameKey: ''
    smtpPasswordKey: ''
    smtpHostKey: ''
  update: 0
  # If web server is not binding default port, you can define it
  containerPort: 80
  datadir: /var/www/html/data
  persistence:
    subPath:
  # Set securityContext parameters for the entire pod.
  podSecurityContext:
    fsGroup: 33
    # Avoid a full recursive chown of the CephFS RWX volume on every pod
    # (re)start - only fix ownership if the root dir doesn't already match.
    fsGroupChangePolicy: OnRootMismatch
  # Accept both hostnames during the migration/validation window — remove
  # new-nextcloud.etsmtl.club once the domain swap (see plan) is complete.
  trustedDomains:
    - new-nextcloud.etsmtl.club
    - nextcloud.etsmtl.club

  configs:
    db.config.php: |-
      <?php
      $CONFIG = array (
         'dbpersistent' => true
         );
    users.config.php: |-
      <?php
      $CONFIG = array (
         'skeletondirectory' => ''
         );
    network.config.php: |-
      <?php
      $CONFIG = array (
        'allow_local_remote_servers' => true,
        'trusted_proxies' => array (
          0 => '10.244.0.0/16',
        ),
        'files.chunked_upload.max_size' => 100 * 1024 * 1024
        );
    logging.config.php: |-
      <?php
      $CONFIG = array (
        'log_type' => 'errorlog',
        'logfile' => '/dev/stdout',
        # loglevel 0 (debug) makes every WebDAV request (PROPFIND/PUT/MKCOL) emit
        # full-stack-trace JSON log entries for internal deprecation warnings
        # (user_oidc lazy AppConfig, IServerContainer alias) and filecache "dirty
        # table reads" notices. Observed adding multiple seconds of overhead per
        # request during the group folder migration sync. 2 = warning.
        'loglevel' => 2,
        'logdateformat' => 'F d, Y H:i:s'
        );
  ## PHP Configuration files
  ## Will be injected in /usr/local/etc/php/conf.d for apache image and in /usr/local/etc/php-fpm.d when nginx.enabled: true
  phpConfigs:
    zz-memory_limit.ini: |-
      memory_limit=1G
    # PHP's 60s default was truncating the S3 multipart upload stream while
    # finalizing large (multi-GB) chunked uploads under load, surfacing as a
    # misleading Sabre\DAV\Exception\Forbidden 403 on the WebDAV MOVE request
    # (root cause: RuntimeException "Unable to read from stream" during
    # Aws\S3\MultipartUploader::createPart) during the group folder migration
    # sync.
    zz-socket-timeout.ini: |-
      default_socket_timeout=300
    apc.ini: |-
      apc.enable_cli=1
      apc.shm_segments=1
      apc.shm_size=128M
      apc.ttl=7200
      apc.user_ttl=7200
      apc.num_files_hint=1024
      apc.enable_cli=1
    opcache.ini: |-
      opcache.enable=1
      opcache.enable_cli=1
      opcache.memory_consumption=256
      opcache.interned_strings_buffer=32
      opcache.max_accelerated_files=10000
      opcache.revalidate_freq=30
      opcache.save_comments=1
      opcache.jit = 1255
      opcache.jit_buffer_size = 8M
  ## Default config files that utilize environment variables:
  ## see: https://github.com/nextcloud/docker/tree/master#auto-configuration-via-environment-variables
  ## IMPORTANT: Will be used only if you put extra configs, otherwise default will come from nextcloud itself
  ## Default confgurations can be found here: https://github.com/nextcloud/docker/tree/master/.config
  defaultConfigs:
    .htaccess: true
    apache-pretty-urls.config.php: true
    apcu.config.php: true
    apps.config.php: true
    autoconfig.php: true
    redis.config.php: true
    reverse-proxy.config.php: true
    # S3 Object Storage as primary storage — activated via OBJECTSTORE_S3_* env vars below.
    s3.config.php: true
    smtp.config.php: true
    swift.config.php: true
    upgrade-disable-web.config.php: true
    imaginary.config.php: false

  previews.config.php: |-
    <?php
    $CONFIG = array (
      'enable_previews' => true,
      'enabledPreviewProviders' => array (
        'OC\Preview\Movie',
        'OC\Preview\PNG',
        'OC\Preview\JPEG',
        'OC\Preview\GIF',
        'OC\Preview\BMP',
        'OC\Preview\XBitmap',
        'OC\Preview\MP3',
        'OC\Preview\MP4',
        'OC\Preview\TXT',
        'OC\Preview\MarkDown',
        'OC\Preview\PDF'
      ),
    );

  hooks:
    pre-installation:
    post-installation:
    pre-upgrade:
    post-upgrade:
    before-starting:

  ## Strategy used to replace old pods
  ## IMPORTANT: use with care, it is suggested to leave as that for upgrade purposes
  strategy:
    type: Recreate

  ##
  ## Extra environment variables
  extraEnv:
    - name: AUTHENTIK_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oidc
          key: client_id
    - name: AUTHENTIK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc
          key: client_secret
    - name: AUTHENTIK_CONFIG_URL
      value: https://auth.etsmtl.club/application/o/nextcloud-new-oidc/.well-known/openid-configuration
    # S3 primary storage — Ceph RGW (hot), tiered to Garage (cold) via
    # lifecycle. See docs/rgw-tiering-runbook.md.
    - name: OBJECTSTORE_S3_BUCKET
      valueFrom:
        configMapKeyRef:
          name: nextcloud-rgw-bucket
          key: BUCKET_NAME
    - name: OBJECTSTORE_S3_REGION
      value: default
    - name: OBJECTSTORE_S3_HOST
      valueFrom:
        configMapKeyRef:
          name: nextcloud-rgw-bucket
          key: BUCKET_HOST
    - name: OBJECTSTORE_S3_PORT
      valueFrom:
        configMapKeyRef:
          name: nextcloud-rgw-bucket
          key: BUCKET_PORT
    - name: OBJECTSTORE_S3_SSL
      value: "false"
    - name: OBJECTSTORE_S3_USEPATH_STYLE
      value: "true"
    - name: OBJECTSTORE_S3_KEY
      valueFrom:
        secretKeyRef:
          name: nextcloud-rgw-bucket
          key: AWS_ACCESS_KEY_ID
    - name: OBJECTSTORE_S3_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-rgw-bucket
          key: AWS_SECRET_ACCESS_KEY
internalDatabase:
  enabled: false
##
## External database configuration
##
externalDatabase:
  enabled: true
  type: postgresql
  host: postgresql-nextcloud-rw.nextcloud-new.svc.cluster.local
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-postgresql
    usernameKey: username
    passwordKey: password
##
## Redis chart configuration
## for more options see https://github.com/bitnami/charts/tree/main/bitnami/redis
##
global:
  security:
    allowInsecureImages: true
redis:
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    pullPolicy: Always
  enabled: true
  auth:
    enabled: true
    existingSecret: redis-secret
    existingSecretPasswordKey: secret
  master:
    persistence:
      enabled: false
    containerSecurityContext:
      enabled: true
      runAsUser: 10000
      runAsGroup: 10000
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  replica:
    persistence:
      enabled: false
    containerSecurityContext:
      enabled: true
      runAsUser: 10000
      runAsGroup: 10000
  commonConfiguration: |-
   # Enable AOF https://redis.io/topics/persistence#append-only-file
   appendonly no
   # Disable RDB persistence, AOF persistence already enabled.
   save ""
## Cronjob to execute Nextcloud background tasks
cronjob:
  enabled: true
  type: cronjob
  cronjob:
    activeDeadlineSeconds: 3600
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true
      readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 50m
      memory: 250Mi
    limits:
      cpu: 350m
      memory: 1Gi
      ephemeral-storage: 2Gi
service:
  type: ClusterIP
  port: 8080
  loadBalancerIP: ''
  nodePort:
  annotations: {}
## Enable persistence using Persistent Volume Claims
## NOTE: this PVC now only holds /var/www/html config+apps (shared RWX across the 3
## replicas). User file data lives in Ceph RGW (tiered to Garage) via OBJECTSTORE_S3_* above — see pvc.yaml
## (shrunk from the 30Ti of the old cephfs-only instance to 20Gi).
##
persistence:
  enabled: true
  existingClaim: nextcloud-pvc
  nextcloudData:
    enabled: false
resources:
  requests:
    memory: 10Gi
    cpu: 1500m
    ephemeral-storage: 2Gi
  limits:
    memory: 30Gi
    cpu: 5000m
    ephemeral-storage: 20Gi
## Liveness and readiness probe values
livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
startupProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  # Generous budget (~40min) for the one-time first-boot rsync of Nextcloud's app code onto
  # the CephFS-backed config PVC, which has been observed taking 10-25+ minutes on this
  # cluster. Without this, the container gets SIGKILLed by the probe before install finishes,
  # then restarts and repeats the slow rsync from scratch — an unrecoverable crash-loop.
  # Subsequent boots skip the rsync (version.php already matches) so this doesn't slow down
  # normal restarts.
  failureThreshold: 240
  successThreshold: 1
hpa:
  enabled: false
  cputhreshold: 60
  minPods: 1
  maxPods: 10
nodeSelector: {}
tolerations: []
affinity: {}
dnsConfig: {}
imaginary:
  enabled: false
  replicaCount: 1
  image:
    registry: docker.io
    repository: h2non/imaginary
    tag: 1.2.4
    pullPolicy: IfNotPresent
    pullSecrets: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  resources: {}
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  podSecurityContext: {}
  readinessProbe:
    enabled: true
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
    timeoutSeconds: 1
  livenessProbe:
    enabled: true
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
    timeoutSeconds: 1
  service:
    type: ClusterIP
    loadBalancerIP:
    nodePort:
    annotations: {}
    labels: {}
## Prometheus Exporter / Metrics
##
metrics:
  enabled: true
  replicaCount: 1
  server: ''
  https: false
  token: ''
  timeout: 5s
  tlsSkipVerify: false
  info:
    apps: true
  image:
    repository: xperimental/nextcloud-exporter
    tag: 0.6.2
    pullPolicy: IfNotPresent
    pullSecrets:
      - dockerhub-pull
  limits:
    memory: 500Mi
    cpu: 500m
    ephemeral-storage: 500Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    loadBalancerIP:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9205'
    labels: {}
  securityContext:
    runAsUser: 10000
    runAsGroup: 10000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  serviceMonitor:
    enabled: false
    namespace: ''
    namespaceSelector:
    jobLabel: ''
    interval: 30s
    scrapeTimeout: ''
    labels: {}
rbac:
  enabled: false
  serviceaccount:
    create: true
    name: nextcloud-serviceaccount
    annotations: {}
securityContext: {}
