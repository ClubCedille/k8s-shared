apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: crd-schema-ingress
spec:
  virtualhost:
    fqdn: schema.k8s.etsmtl.club
    tls:
      secretName: crd-tls-secret
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: crd-schema-publisher
          port: 8081
