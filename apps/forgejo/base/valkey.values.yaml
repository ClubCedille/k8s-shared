# yaml-language-server: $schema=https://raw.githubusercontent.com/valkey-io/valkey-helm/refs/heads/main/valkey/values.schema.json
# Valkey runs in master/replica mode: 1 master + 2 replicas, each with its own
# RWO PVC (volumeClaimTemplates). The master Service still targets pod-0 only.
#
# WARNING: this chart does not ship automatic failover (no Sentinel). Replicas
# provide data redundancy and read scaling; pod `forgejo-cache-valkey-0` remains
# the only writable master. See the PR description for the availability caveat.
replica:
  enabled: true
  replicas: 2
  persistence:
    size: "5Gi"
    storageClass: "ceph-rbd"
    accessModes:
      - ReadWriteOnce

# Only used in standalone mode (replica.enabled=false). Kept as a safety net:
# with a single RWO PVC, RollingUpdate can never complete (the replacement pod
# cannot mount the volume while the old pod still holds it).
deploymentStrategy: Recreate

serviceAccount:
  # Create a service account for Valkey
  create: true
  # Whether to automount the service account token
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # Name of an existing service account to use (if create: false)
  name: ""

# Security context for the pod (applies to all containers)
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Security context for the Valkey containers
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  # Type of Service (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # Port on which Valkey will be exposed
  port: 6379

# Network policy to control traffic to the pods
# More info: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy: {}

# Spread the 3 pods across nodes so a single node loss cannot take the whole
# cache down. Soft constraint on purpose: scheduling must never block.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: forgejo-cache

# Only used in replica mode. Allow one pod to be disrupted at a time.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

auth:
  # Enable ACL-based authentication
  enabled: false

# Valkey logging level: debug, verbose, notice, warning
valkeyLogLevel: "notice"

metrics:
  # Enable Prometheus exporter sidecar
  enabled: true

  exporter:
    # Additional secrets to mount for metrics exporter
    extraExporterSecrets: []
