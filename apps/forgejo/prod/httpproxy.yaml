apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: forgejo
  namespace: forgejo
spec:
  virtualhost:
    fqdn: git.etsmtl.club
    tls:
      secretName: forgejo-tls-secret
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      enableWebsockets: true
      services:
        - name: forgejo-http
          port: 3000
