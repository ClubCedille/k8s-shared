apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: hi-events
spec:
  virtualhost:
    fqdn: events.etsmtl.club
    tls:
      secretName: hi-events-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /
      services:
        - name: hi-events
          port: 80
